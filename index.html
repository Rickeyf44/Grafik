      // === ПРИВЯЗКА ИНПУТОВ ===
      function bindTabInputs() {
        const payInp = document.getElementById('inpPayRate');
        if (payInp) {
          payInp.onchange = (e) => {
            state.schedule.payRate = Math.max(0, Number(e.target.value) || 0);
            saveState();
            renderAll();
          };
        }
        const eveInp = document.getElementById('inpEveTime');
        if (eveInp) {
          eveInp.onchange = (e) => { state.notifications.eveTime = e.target.value || '19:00'; saveState(); renderAll(); };
        }
        const tzSel = document.getElementById('selTimezone');
        if (tzSel) {
          tzSel.onchange = (e) => { state.notifications.timezone = e.target.value; saveState(); PlatformBridge.haptic('selection'); };
        }
        const formAdd = document.getElementById('formAddCheck');
        if (formAdd) {
          formAdd.onsubmit = (e) => {
            e.preventDefault();
            const v = (document.getElementById('inpNewCheck').value || '').trim();
            if (!v) return;
            state.checklist.push({ id: 'c_' + Date.now(), text: v, checked: false });
            saveState();
            PlatformBridge.haptic('light');
            renderAll();
          };
        }
        const profName = document.getElementById('inpProfileName');
        if (profName) {
          profName.onchange = (e) => {
            state.profile.name = (e.target.value || 'Гость').trim();
            saveState();
            renderShellChrome();
            showToast('Имя обновлено', 'success');
          };
        }
        const sDate = document.getElementById('inpStartDate');
        if (sDate) {

      function bindModalInputs() {
        const form = document.getElementById('dayEditForm');
        if (form) {
          const updatePreview = () => {
            const type = document.getElementById('shType').value;
            const hours = Number(document.getElementById('shHours').value) || 0;
            const bonus = Number(document.getElementById('shBonus').value) || 0;
            const m = calculateDayMetrics({ date: form.dataset.date, type, hours, bonus });
            const el = document.getElementById('shPayPreview');
            if (el) el.textContent = `Итого: ${formatMoney(m.pay)}`;
          };

          form.querySelectorAll('.sheet-type-btn').forEach(btn => {
            btn.onclick = () => {
              const t = btn.dataset.type;
              document.getElementById('shType').value = t;
              form.querySelectorAll('.sheet-type-btn').forEach(b => {
                const act = b.dataset.type === t;
                b.classList.toggle('active', act);
                const dot = b.querySelector('span:first-child');
                if (dot) dot.style.background = act ? '#fff' : SHIFT_TYPES[b.dataset.type].colorVar;
              });
              const work = SHIFT_TYPES[t].work;
              document.getElementById('shWorkBox').style.display = work ? 'grid' : 'none';
              if (work) {
                const h = getStandardHours(t);
                const st = t === 'night' ? (state.schedule.defaultNightStartTime || '20:00') : (state.schedule.defaultStartTime || '08:00');
                document.getElementById('shHours').value = h;
                document.getElementById('shStart').value = st;
                document.getElementById('shEnd').value = computeEndTime(st, h);
              }
              PlatformBridge.haptic('selection');
              updatePreview();
            };
          });

          const shStart = document.getElementById('shStart');
          const shEnd = document.getElementById('shEnd');
          const shHours = document.getElementById('shHours');
          const shBonus = document.getElementById('shBonus');

          shStart.onchange = () => { shEnd.value = computeEndTime(shStart.value, shHours.value); };
          shHours.oninput = () => { shEnd.value = computeEndTime(shStart.value, shHours.value); updatePreview(); };
          shEnd.onchange = () => { shHours.value = computeHoursBetween(shStart.value, shEnd.value); updatePreview(); };
          shBonus.oninput = updatePreview;

          form.onsubmit = (e) => {
            e.preventDefault();
            const dStr = form.dataset.date;
            const type = document.getElementById('shType').value;
            const isWork = SHIFT_TYPES[type].work;
            state.overrides[dStr] = {
              type,
              startTime: shStart.value || '08:00',
              hours: isWork ? Math.min(24, Math.max(0, Number(shHours.value) || 0)) : 0,
              bonus: Number(shBonus.value) || 0,
              note: (document.getElementById('shNote').value || '').trim()
            };
            saveState();
            PlatformBridge.haptic('success');
            closeAllModals();
            renderAll();
            showToast(`Изменения на ${formatShortDate(dStr)} сохранены`, 'success');
          };
        }

        const fileInp = document.getElementById('fileImportJson');
        if (fileInp) {
          fileInp.onchange = (e) => {
            const f = e.target.files && e.target.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = () => { document.getElementById('txtImportJson').value = r.result || ''; };
            r.readAsText(f);
          };
        }
      }

      // === ЭКСПОРТ .ICS (ВЕСЬ ГОД + VALARM ЗА 24Ч) ===
      function exportYearICS() {
        try {
          const y = ui.viewYear;
          const alarmMin = state.notifications.mode === '12h' ? 720 : 1440;
          const checklistLines = state.checklist.map(c => `- ${c.text}`).join('\\n');
          const out = [
            'BEGIN:VCALENDAR',
            'VERSION:2.0',
            'PRODID:-//SmenaPro//MultiPlatform//RU',
            'CALSCALE:GREGORIAN',
            `X-WR-CALNAME:СменаPro ${y}`
          ];

          for (let m0 = 0; m0 < 12; m0++) {
            const days = getDaysInMonth(y, m0);
            for (let d = 1; d <= days; d++) {
              const iso = formatDateISO(y, m0, d);
              const info = getDayInfo(iso);
              const meta = SHIFT_TYPES[info.type];
              if (!meta || !meta.work || info.hours <= 0) continue;

              const st = getShiftDateTime(iso, info.startTime);
              const en = new Date(st.getTime() + info.hours * 3600000);
              const fmt = dt => `${dt.getFullYear()}${pad2(dt.getMonth() + 1)}${pad2(dt.getDate())}T${pad2(dt.getHours())}${pad2(dt.getMinutes())}00`;
              const desc = [`Смена: ${meta.name} (${info.hours}ч)`];
              if (info.note) desc.push(`Заметка: ${info.note.replace(/\n/g, ' ')}`);
              if (checklistLines) desc.push(`Чек-лист:\\n${checklistLines}`);

              out.push(
                'BEGIN:VEVENT',
                `UID:smenapro-${iso}@smenapro`,
                `DTSTART:${fmt(st)}`,
                `DTEND:${fmt(en)}`,
                `SUMMARY:Смена: ${meta.name} (${info.hours}ч)`,
                `DESCRIPTION:${desc.join('\\n')}`,
                'BEGIN:VALARM',
                `TRIGGER:-PT${alarmMin}M`,
                'ACTION:DISPLAY',
                'DESCRIPTION:Завтра на смену! Проверьте чек-лист сборов.',
                'END:VALARM',
                'END:VEVENT'
              );
            }
          }
          out.push('END:VCALENDAR');
          downloadFile(new Blob([out.join('\r\n')], { type: 'text/calendar;charset=utf-8' }), `SmenaPro_${y}.ics`);
          PlatformBridge.haptic('success');
          showToast(`Календарь SmenaPro_${y}.ics выгружен!`, 'success');
        } catch (_) {
          showToast('Ошибка при создании .ics файла', 'error');
        }
      }

      // === ПОДКЛЮЧЕНИЕ ПАРТНЁРА ПО КОДУ (ОБЛАКО SUPABASE ИЛИ ОФЛАЙН SM1_) ===
      async function connectPartnerByCode(rawInput, silentIfFail = false) {
        const clean = String(rawInput || '').trim();
        if (!clean) {
          if (!silentIfFail) showToast('Введите код партнёра', 'warning');
          return;
        }

        // 1. Офлайн-код SM1_...
        const offline = decodeOfflinePartnerCode(clean);
        if (offline) {
          state.partner = {
            enabled: true,
            mode: 'code',
            name: offline.name,
            code: clean.replace(/^sync_/, ''),
            platform: 'TG↔MAX',
            preset: offline.preset,
            startDate: offline.startDate,
            customCycle: offline.customCycle,
            overrides: {}
          };
          saveState();
          PlatformBridge.haptic('success');
          closeAllModals();
          renderAll();
          showToast(`График «${offline.name}» подключён! Общие выходные подсвечены`, 'success');
          return;
        }

        // 2. Облачный код SM-XXXX в Supabase
        const cloudCode = clean.replace(/^sync_/, '').toUpperCase();
        if (/^SM-\d{4,}$/.test(cloudCode)) {
          if (!CloudSync.isConfigured()) {
            if (!silentIfFail) showToast('Supabase не настроен. Используйте офлайн-код SM1_...', 'warning');
            return;
          }
          showToast('Ищем график партнёра в Supabase...', 'info');
          const res = await CloudSync.fetchPartnerByCode(cloudCode);
          if (res.ok && res.data && res.data.schedule_config) {
            const sc = res.data.schedule_config;
            state.partner = {
              enabled: true,
              mode: 'code',
              name: res.data.display_name || 'Партнёр',
              code: cloudCode,
              platform: res.data.platform || '',
              preset: sc.preset || '1/3',
              startDate: sc.startDate || getTodayISO(),
              customCycle: sc.customCycle || ['day', 'off'],
              overrides: res.data.overrides || {}
            };
            saveState();
            PlatformBridge.haptic('success');
            closeAllModals();
            renderAll();
            showToast(`Подключён облачный график: ${state.partner.name}!`, 'success');
            return;
          }
          if (!silentIfFail) showToast(res.message || 'Не удалось найти код в базе', 'error');
          return;
        }

        if (!silentIfFail) showToast('Неверный формат кода (нужен SM-XXXX или SM1_...)', 'error');
      }

      // === ТЕСТОВЫЙ ПУШ И СИНХРОНИЗАЦИЯ ===
      async function handleTestPush() {
        PlatformBridge.haptic('medium');
        const user = PlatformBridge.getUser(state.profile.name);
        const live = computeLiveStatus();
        const nextInfo = live.next ? live.next.info : getDayInfo(addDaysISO(getTodayISO(), 1));

        if (APP_CONFIG.PUSH_WEBHOOK_URL && APP_CONFIG.PUSH_WEBHOOK_URL.trim().startsWith('http')) {
          try {
            showToast('Отправляем тестовый пуш...', 'info');
            const res = await fetch(APP_CONFIG.PUSH_WEBHOOK_URL.trim(), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                user_key: user.userKey,
                platform: user.platform,
                platform_user_id: user.id,
                display_name: state.profile.name,
                next_shift: nextInfo,
                checklist: state.checklist
              })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            PlatformBridge.haptic('success');
            showToast(`Тестовый пуш отправлен в ${PlatformBridge.getPlatformLabel()}!`, 'success');
          } catch (_) {
            PlatformBridge.haptic('error');
            showToast('Вебхук пуша не ответил — проверьте PUSH_WEBHOOK_URL', 'error');
          }
        } else {
          showToast('Вебхук пуша ещё не задан — смотрите предпросмотр сообщения выше!', 'info');
        }
      }

        else if (ui.activeTab === 'stats') main.innerHTML = renderStatsTab();

      // === ЕДИНОЕ ДЕЛЕГИРОВАНИЕ КЛИКОВ ===
      document.addEventListener('click', async (e) => {
        const tabBtn = e.target.closest('.tab-btn');
        if (tabBtn) {
          ui.activeTab = tabBtn.dataset.tab;
          PlatformBridge.haptic('selection');
          renderAll();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }

        if (e.target.closest('#btnToday')) {
          const t = new Date();
          ui.viewYear = t.getFullYear();
          ui.viewMonth = t.getMonth();
          ui.selectedChartMonth = t.getMonth();
          ui.calendarMode = 'month';
          ui.activeTab = 'calendar';
          PlatformBridge.haptic('light');
          renderAll();
          return;
        }

        const el = e.target.closest('[data-action]');
        if (!el) return;
        const act = el.dataset.action;

        switch (act) {
          case 'go-checklist':
            ui.activeTab = 'reminders';
            PlatformBridge.haptic('medium');
            renderAll();
            setTimeout(() => {
              const card = document.getElementById('checklistAnchor');
              if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 60);
            break;

          case 'go-calendar':
            ui.activeTab = 'calendar';
            PlatformBridge.haptic('light');
            renderAll();
            break;

          case 'cal-mode':
            ui.calendarMode = el.dataset.mode;
            PlatformBridge.haptic('selection');
            renderAll();
            break;

          case 'cal-prev':
            if (ui.calendarMode === 'year') ui.viewYear--;
            else { ui.viewMonth--; if (ui.viewMonth < 0) { ui.viewMonth = 11; ui.viewYear--; } }
            PlatformBridge.haptic('light');
            renderAll();
            break;

          case 'cal-next':
            if (ui.calendarMode === 'year') ui.viewYear++;
            else { ui.viewMonth++; if (ui.viewMonth > 11) { ui.viewMonth = 0; ui.viewYear++; } }
            PlatformBridge.haptic('light');
            renderAll();
            break;

          case 'open-month':
            ui.viewMonth = Number(el.dataset.month);
            ui.calendarMode = 'month';
            PlatformBridge.haptic('selection');
            renderAll();
            break;

          case 'edit-day':
            ui.editingDate = el.dataset.date;
            PlatformBridge.haptic('light');
            renderModals();
            break;

          case 'close-modal':
            closeAllModals();
            break;

          case 'bonus-add': {
            const inp = document.getElementById('shBonus');
            if (inp) {
              inp.value = (Number(inp.value) || 0) + Number(el.dataset.delta);
              inp.dispatchEvent(new Event('input'));
              PlatformBridge.haptic('light');
            }
            break;
          }

          case 'reset-day':
            delete state.overrides[el.dataset.date];
            saveState();
            PlatformBridge.haptic('warning');
            closeAllModals();
            renderAll();
            showToast('День сброшен к базовому графику', 'info');
            break;

          case 'toggle-partner':
            state.partner.enabled = !state.partner.enabled;
            saveState();
            PlatformBridge.haptic('light');
            renderAll();
            break;

          case 'open-partner-sheet':

            PlatformBridge.haptic('light');
            renderModals();
            break;

          case 'partner-tab':

            PlatformBridge.haptic('selection');
            renderModals();
            break;

          case 'copy-share-code': {
            const ok = copyTextSafely(el.dataset.code);
            PlatformBridge.haptic(ok ? 'success' : 'error');
            showToast(ok ? 'Код синхронизации скопирован!' : 'Не удалось скопировать', ok ? 'success' : 'error');
            break;
          }

          case 'share-partner-link': {
            const links = buildShareLinks();
            const preferredUrl = PlatformBridge.platform === 'max'
              ? (links.maxLink || links.webLink)
              : PlatformBridge.platform === 'telegram'
                ? (links.tgLink || links.webLink)
                : (links.webLink || links.tgLink || links.maxLink);
            const msg = `Подключи мой график смен в СменаPro, чтобы видеть наши общие выходные! Код: ${links.preferredCode}`;
            PlatformBridge.haptic('medium');
            PlatformBridge.share(msg, preferredUrl);
            break;
          }

          case 'connect-partner-code': {
            const inp = document.getElementById('inpPartnerCode');
            connectPartnerByCode(inp ? inp.value : '');
            break;
          }

          case 'save-partner-manual': {
            const nm = (document.getElementById('inpPartnerName').value || 'Партнёр').trim();
            const pr = document.getElementById('selPartnerPreset').value;
            const sd = document.getElementById('inpPartnerStart').value || getTodayISO();
            state.partner = { ...state.partner, enabled: true, mode: 'manual', name: nm, preset: pr, startDate: sd, overrides: {} };
            saveState();
            PlatformBridge.haptic('success');
            closeAllModals();
            renderAll();
            showToast(`График «${nm}» включён!`, 'success');
            break;
          }

          case 'stats-scope':
            ui.statsScope = el.dataset.scope;
            PlatformBridge.haptic('selection');
            renderAll();
            break;

          case 'stats-prev':

            else { ui.viewMonth--; if (ui.viewMonth < 0) { ui.viewMonth = 11; ui.viewYear--; } ui.selectedChartMonth = ui.viewMonth; }
            PlatformBridge.haptic('light');
            renderAll();
            break;

          case 'stats-next':
            if (ui.statsScope === 'year') ui.viewYear++;
            else { ui.viewMonth++; if (ui.viewMonth > 11) { ui.viewMonth = 0; ui.viewYear++; } ui.selectedChartMonth = ui.viewMonth; }
            PlatformBridge.haptic('light');
            renderAll();
            break;

          case 'chart-metric':
            ui.statsMetric = el.dataset.metric;
            PlatformBridge.haptic('selection');
            renderAll();
            break;

          case 'chart-month':
            ui.selectedChartMonth = Number(el.dataset.month);
            PlatformBridge.haptic('selection');
            renderAll();
            break;

            PlatformBridge.haptic('light');
            renderAll();
            break;

            state.schedule.payType = el.dataset.type;
            if (el.dataset.type === 'hour' && state.schedule.payRate > 3000) state.schedule.payRate = 450;
            if (el.dataset.type === 'shift' && state.schedule.payRate < 1000) state.schedule.payRate = 6800;
            if (el.dataset.type === 'salary' && state.schedule.payRate < 20000) state.schedule.payRate = 85000;
            saveState();
            PlatformBridge.haptic('selection');
            renderAll();
            break;

          case 'set-ot':

            saveState();
            PlatformBridge.haptic('selection');
            renderAll();
            break;

          case 'set-night-pct':
            state.schedule.nightBonusPercent = Number(el.dataset.val);
            saveState();
            PlatformBridge.haptic('selection');
            renderAll();
            break;

          case 'toggle-push':
            state.notifications.enabled = !state.notifications.enabled;
            saveState();
            PlatformBridge.haptic('light');
            renderAll();
            break;

          case 'push-mode':
            state.notifications.mode = el.dataset.mode;
            saveState();
            PlatformBridge.haptic('selection');
            renderAll();
            break;

          case 'toggle-check': {
            const it = state.checklist.find(c => c.id === el.dataset.id);
            if (it) {
              it.checked = !it.checked;
              saveState();
              PlatformBridge.haptic(it.checked ? 'success' : 'light');
              renderAll();
            }
            break;
          }

          case 'del-check':
            state.checklist = state.checklist.filter(c => c.id !== el.dataset.id);
            saveState();
            PlatformBridge.haptic('warning');
            renderAll();
            break;

            renderAll();

            break;

            const ok = copyTextSafely(state.profile.syncCode);
            PlatformBridge.haptic(ok ? 'success' : 'error');
            showToast(ok ? `Код ${state.profile.syncCode} скопирован!` : 'Ошибка копирования', ok ? 'success' : 'error');

          case 'add-cycle-step':
            state.schedule.customCycle.push(el.dataset.type);
            saveState();
            PlatformBridge.haptic('light');
            renderAll();
            break;

          case 'del-cycle-step':
            if (state.schedule.customCycle.length > 1) {
              state.schedule.customCycle.splice(Number(el.dataset.idx), 1);
              saveState();
              PlatformBridge.haptic('light');
              renderAll();
            } else {
              showToast('Минимум 1 день в цикле', 'warning');
            }
            break;

          case 'clear-cycle':
            state.schedule.customCycle = ['day', 'off'];
            saveState();
            PlatformBridge.haptic('warning');
            renderAll();
            break;

          case 'set-theme':
            state.themeMode = el.dataset.mode;
            saveState();
            PlatformBridge.haptic('selection');
            renderAll();
            break;

          case 'export-ics':
            exportYearICS();
            break;

          case 'export-json':
            downloadFile(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }), `SmenaPro_backup_${getTodayISO()}.json`);
            PlatformBridge.haptic('success');
            showToast('Резервная копия JSON сохранена', 'success');
            break;

          case 'open-import':
            ui.showImportModal = true;
            renderModals();
            break;

          case 'copy-json-now': {
            const ok = copyTextSafely(JSON.stringify(state));
            showToast(ok ? 'Текущий JSON скопирован' : 'Ошибка копирования', ok ? 'success' : 'error');
            break;
          }

          case 'apply-import': {
            const raw = (document.getElementById('txtImportJson').value || '').trim();
            if (!raw) { showToast('Вставьте JSON или выберите файл', 'warning'); return; }
            try {
              const p = JSON.parse(raw);
              if (!p || !p.schedule) throw new Error('bad');
              const def = createDefaultState();
              state = {
                ...def, ...p,
                profile: { ...def.profile, ...(p.profile || {}) },
                schedule: { ...def.schedule, ...(p.schedule || {}) },
                partner: { ...def.partner, ...(p.partner || {}) },
                notifications: { ...def.notifications, ...(p.notifications || {}) },
                overrides: p.overrides || {},
                checklist: Array.isArray(p.checklist) ? p.checklist : def.checklist
              };
              saveState();
              PlatformBridge.haptic('success');
              closeAllModals();
              renderAll();
              showToast('Данные восстановлены из бэкапа!', 'success');
            } catch (_) {
              PlatformBridge.haptic('error');
              showToast('Некорректный формат JSON', 'error');
            }
            break;
          }

          case 'open-reset':
            ui.showResetModal = true;
            PlatformBridge.haptic('warning');
            renderModals();
            break;

          case 'confirm-reset':
            localStorage.removeItem(STORAGE_KEY);
            state = createDefaultState();
            saveState();
            PlatformBridge.haptic('success');
            closeAllModals();
            renderAll();
            showToast('Данные сброшены к базовому графику 1/3', 'info');
            break;

          // Диагностика Supabase
          case 'diag-test-sb': {
            PlatformBridge.haptic('medium');
            const res = await CloudSync.testConnection();
            renderAll();
            showToast(res.message, res.ok ? 'success' : 'error');
            break;
          }

          case 'diag-sync-now': {
            PlatformBridge.haptic('medium');
            const res = await CloudSync.pushState(true);
            renderAll();
            if (res.ok) PlatformBridge.haptic('success');
            break;
          }
        }
      });

      // === СТАРТ ПРИЛОЖЕНИЯ ===
      function bootstrap() {
        PlatformBridge.init();
        state = loadState();
        ui.previewSkin = PlatformBridge.platform === 'max' ? 'max' : 'telegram';

        renderAll();

        // Автоподхват кода синхронизации партнёра из диплинка (?startapp=sync_...)
        const startParam = PlatformBridge.getStartParam();
        if (startParam && startParam.startsWith('sync_')) {
          connectPartnerByCode(startParam, true);
        }

        // Тихая фоновая синхронизация с Supabase при старте (без навязчивых ошибок)
        if (CloudSync.isConfigured()) {
          CloudSync.pushState(false);
        }

        // Живое обновление таймера каждые 30 секунд
        setInterval(() => {
          renderShellChrome();
        }, 30000);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootstrap);
      } else {
        bootstrap();
      }
    })();
  </script>
</body>
</html>
