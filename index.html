        recovery: { id: 'recovery', name: 'Отсыпной',   short: 'Отс',  work: false, defaultHours: 0,  defaultStart: '00:00', defaultEnd: '00:00', colorVar: 'var(--t-recovery-solid)' },
        off:      { id: 'off',      name: 'Выходной',   short: 'Вых',  work: false, defaultHours: 0,  defaultStart: '00:00', defaultEnd: '00:00', colorVar: 'var(--t-off-solid)' },
        vacation: { id: 'vacation', name: 'Отпуск',     short: 'Отп',  work: false, defaultHours: 0,  defaultStart: '00:00', defaultEnd: '00:00', colorVar: 'var(--t-vacation-solid)' },
        sick:     { id: 'sick',     name: 'Больничный', short: 'Бол',  work: false, defaultHours: 0,  defaultStart: '00:00', defaultEnd: '00:00', colorVar: 'var(--t-sick-solid)' }
      };

      const PRESETS = {
        '1/3':    { id: '1/3',    label: '1/3 (Сутки)', desc: '24ч работа, 3 выходных',       cycle: ['full24', 'off', 'off', 'off'],                   defaultHours: 24, defaultStart: '08:00' },
        '2/2':    { id: '2/2',    label: '2/2',         desc: '2 дня по 12ч, 2 выходных',     cycle: ['day', 'day', 'off', 'off'],                      defaultHours: 12, defaultStart: '08:00' },
        '5/2':    { id: '5/2',    label: '5/2',         desc: '8ч по будням, Сб–Вс вых.',     cycle: ['day', 'day', 'day', 'day', 'day', 'off', 'off'], defaultHours: 8,  defaultStart: '09:00' },
        'rzd':    { id: 'rzd',    label: 'Ж/Д',         desc: 'День / Ночь / Отсыпной / Вых', cycle: ['day', 'night', 'recovery', 'off'],               defaultHours: 12, defaultStart: '08:00' },
        '3/3':    { id: '3/3',    label: '3/3',         desc: '3 дня по 12ч, 3 выходных',     cycle: ['day', 'day', 'day', 'off', 'off', 'off'],        defaultHours: 12, defaultStart: '08:00' },
        'custom': { id: 'custom', label: 'Свой цикл',   desc: 'Любой порядок и длина цикла',  cycle: ['day', 'night', 'recovery', 'off'],               defaultHours: 12, defaultStart: '08:00' }
      };

      const TIMEZONES = [
        { id: 'Europe/Kaliningrad', label: 'Калининград (UTC+2)', offset: 2 },
        { id: 'Europe/Moscow',      label: 'Москва / МСК (UTC+3)', offset: 3 },
        { id: 'Europe/Samara',      label: 'Самара (UTC+4)', offset: 4 },
        { id: 'Asia/Yekaterinburg', label: 'Екатеринбург (UTC+5)', offset: 5 },
        { id: 'Asia/Omsk',          label: 'Омск (UTC+6)', offset: 6 },
        { id: 'Asia/Novosibirsk',   label: 'Новосибирск / Красноярск (UTC+7)', offset: 7 },
        { id: 'Asia/Irkutsk',       label: 'Иркутск (UTC+8)', offset: 8 },
        { id: 'Asia/Yakutsk',       label: 'Якутск (UTC+9)', offset: 9 },
        { id: 'Asia/Vladivostok',   label: 'Владивосток (UTC+10)', offset: 10 },
        { id: 'Asia/Magadan',       label: 'Магадан (UTC+11)', offset: 11 },
        { id: 'Asia/Kamchatka',     label: 'Камчатка (UTC+12)', offset: 12 }
      ];

      function getTimezoneOffsetHours(tzId) {
        const found = TIMEZONES.find(t => t.id === tzId);
        return found ? found.offset : 3;
      }

      // === 4. УТИЛИТЫ ДАТ, ВРЕМЕНИ И БЕЗОПАСНОСТИ ===
      function pad2(n) { return String(n).padStart(2, '0'); }
      function formatDateISO(y, m0, d) { return `${y}-${pad2(m0 + 1)}-${pad2(d)}`; }

      function getTodayISO(tzId) {
        const offsetMs = getTimezoneOffsetHours(tzId || APP_CONFIG.DEFAULT_TIMEZONE) * 3600000;
        const shifted = new Date(Date.now() + offsetMs);
        return formatDateISO(shifted.getUTCFullYear(), shifted.getUTCMonth(), shifted.getUTCDate());
      }

      function addDaysISO(dateStr, days) {
        const [y, m, d] = dateStr.split('-').map(Number);
        const dt = new Date(Date.UTC(y, m - 1, d + days));
        return formatDateISO(dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate());
      }

      function diffDays(a, b) {
        const [ya, ma, da] = a.split('-').map(Number);
        const [yb, mb, db] = b.split('-').map(Number);
        return Math.round((Date.UTC(ya, ma - 1, da) - Date.UTC(yb, mb - 1, db)) / 86400000);
      }

      function getDaysInMonth(y, m0) { return new Date(Date.UTC(y, m0 + 1, 0)).getUTCDate(); }
      function getDowMon0(y, m0, d) { return (new Date(Date.UTC(y, m0, d)).getUTCDay() + 6) % 7; }

      function formatHumanDate(iso) {
        const [y, m, d] = iso.split('-').map(Number);
        const dow = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
        return `${WEEKDAYS_FULL[dow]}, ${d} ${MONTHS_GEN[m - 1]} ${y}`;
      }

      function formatShortDate(iso) {
        const [y, m, d] = iso.split('-').map(Number);
        return `${d} ${MONTHS_GEN[m - 1]}`;
      }

      function formatMoney(v) {
        return new Intl.NumberFormat('ru-RU').format(Math.round(v)) + ' ' + CUR;
      }

      function escapeHtml(s) {
        return String(s || '')
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function shiftToUtcMs(dateStr, timeStr, tzId) {
        const [y, m, d] = dateStr.split('-').map(Number);
        const [hh, mm] = (timeStr || '08:00').split(':').map(Number);
        const offsetHours = getTimezoneOffsetHours(tzId);
        return Date.UTC(y, m - 1, d, (hh || 0) - offsetHours, mm || 0, 0, 0);
      }

      function formatTimeInTz(utcMs, tzId) {
        const offsetMs = getTimezoneOffsetHours(tzId) * 3600000;
        const shifted = new Date(utcMs + offsetMs);
        return `${pad2(shifted.getUTCHours())}:${pad2(shifted.getUTCMinutes())}`;
      }

      function formatDateInTz(utcMs, tzId) {
        const offsetMs = getTimezoneOffsetHours(tzId) * 3600000;
        const shifted = new Date(utcMs + offsetMs);
        return formatDateISO(shifted.getUTCFullYear(), shifted.getUTCMonth(), shifted.getUTCDate());
      }

      function computeEndTime(startTime, hours) {
        const [hh, mm] = (startTime || '08:00').split(':').map(Number);
        const totalMin = ((hh || 0) * 60 + (mm || 0) + Math.round((Number(hours) || 0) * 60)) % 1440;
        const norm = (totalMin + 1440) % 1440;
        return `${pad2(Math.floor(norm / 60))}:${pad2(norm % 60)}`;
      }

      function computeHoursBetween(startTime, endTime, fallback = 12) {
        if (!startTime || !endTime) return fallback;
        const [sh, sm] = startTime.split(':').map(Number);
        const [eh, em] = endTime.split(':').map(Number);
        let diffMin = (eh * 60 + em) - (sh * 60 + sm);
        if (diffMin <= 0) diffMin += 1440;
        return Math.round((diffMin / 60) * 10) / 10;
      }

      function generateSyncCode() {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let out = 'SM-';
        for (let i = 0; i < 5; i++) out += chars.charAt(Math.floor(Math.random() * chars.length));
        return out;
      }

      function copyTextSafely(text) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          return ok;
        } catch (_) {
          return false;
        }
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
      }

      // === 5. МГНОВЕННЫЙ 0ms ПАРСЕР URL/HASH + УМНЫЙ АСИНХРОННЫЙ ЗАГРУЗЧИК SDK ===
      function safeDecode(str) {
        try { return decodeURIComponent(str); } catch (_) { return str; }
      }

      function parseInitDataString(rawData) {
        const result = { userId: null, firstName: null, startParam: '' };
        if (!rawData) return result;
        try {
          let decoded = rawData;
          if (!decoded.includes('=') && decoded.includes('%3D')) {
            decoded = safeDecode(decoded);
          }
          const inner = new URLSearchParams(decoded);
          const sp = inner.get('start_param') || inner.get('startapp') || '';
          if (sp) result.startParam = sp;

          const userRaw = inner.get('user');
          if (userRaw) {
            let uObj = null;
            try { uObj = JSON.parse(userRaw); } catch (_) {
              try { uObj = JSON.parse(safeDecode(userRaw)); } catch (_) {}
            }
            if (uObj && typeof uObj === 'object') {
              if (uObj.id !== undefined && uObj.id !== null) result.userId = String(uObj.id);
              if (uObj.first_name || uObj.firstName) result.firstName = String(uObj.first_name || uObj.firstName);
            }
          }
        } catch (_) {}
        return result;
      }

      /**
       * 0ms парсер location.hash и location.search: распознаёт платформу (tg/max),
       * platform_user_id, display_name и start_param ДО загрузки внешних скриптов SDK.
       */
      function parseUrlLaunchData() {
        const info = {
          platform: 'web',
          userId: null,
          firstName: null,
          startParam: '',
          hasTgHint: false,
          hasMaxHint: false
        };

        try {
          const hashStr = (window.location.hash || '').replace(/^#/, '');
          const searchStr = (window.location.search || '').replace(/^\?/, '');
          const combinedHref = `${searchStr}&${hashStr}`;
          const ua = navigator.userAgent || '';
          const ref = document.referrer || '';

          const hashParams = new URLSearchParams(hashStr);
          const searchParams = new URLSearchParams(searchStr);
          const getParam = (k) => hashParams.get(k) || searchParams.get(k) || '';

          const tgWebAppData = getParam('tgWebAppData');
          const maxWebAppData = getParam('WebAppData') || getParam('maxWebAppData');
          const tgStart = getParam('tgWebAppStartParam');
          const genericStart = getParam('startapp') || getParam('start_param');

          info.hasTgHint =
            Boolean(tgWebAppData) ||
            Boolean(tgStart) ||
            /tgWebApp/i.test(combinedHref) ||
            Boolean(window.TelegramWebviewProxy) ||
            /Telegram/i.test(ua);

          info.hasMaxHint =
            Boolean(maxWebAppData) ||
            /WebAppData/i.test(combinedHref) ||
            Boolean(window.WebApp) ||
            /\bMAX\b|MaxApp|Oneme/i.test(ua) ||
            /max\.ru/i.test(ref);

          if (tgWebAppData) {
            info.platform = 'tg';
            const parsed = parseInitDataString(tgWebAppData);
            if (parsed.userId) info.userId = parsed.userId;
            if (parsed.firstName) info.firstName = parsed.firstName;
            if (parsed.startParam) info.startParam = parsed.startParam;
          } else if (maxWebAppData) {
            info.platform = 'max';
            const parsed = parseInitDataString(maxWebAppData);
            if (parsed.userId) info.userId = parsed.userId;
            if (parsed.firstName) info.firstName = parsed.firstName;
            if (parsed.startParam) info.startParam = parsed.startParam;
          } else if (info.hasTgHint && !info.hasMaxHint) {
            info.platform = 'tg';
          } else if (info.hasMaxHint && !info.hasTgHint) {
            info.platform = 'max';
          }

          if (!info.startParam) {
            info.startParam = tgStart || genericStart || '';
          }
        } catch (_) {}

        return info;
      }

      const PlatformBridge = {
        platform: 'web',
        sdk: null,
        sdkState: 'init', // 'init' | 'loading' | 'ready' | 'fallback' | 'web'
        sdkLabel: 'Определение...',
        urlData: null,
        _backCb: null,
        _attached: false,

        initZeroMs() {
          this.urlData = parseUrlLaunchData();
          this.platform = this.urlData.platform || 'web';

          // Если SDK уже присутствует в окне на 0ms — сразу привязываемся
          if (!this.attachSdk(true)) {
            if (this.platform === 'tg') {
              this.sdkState = 'loading';
              this.sdkLabel = '0ms URL-парсер (TG SDK...)';
            } else if (this.platform === 'max') {
              this.sdkState = 'loading';
              this.sdkLabel = '0ms URL-парсер (MAX SDK...)';
            } else {
              this.sdkState = 'web';
              this.sdkLabel = 'Web / PWA (без SDK)';
            }
          }
          return this.platform;
        },

        /**
         * Привязка к нативному объекту SDK (вызывается на 0ms, при onload и по 150ms поллингу)
         */
        attachSdk(silent = false) {
          if (this._attached && this.sdk) return true;
          try {
            const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
            const max = window.WebApp ? window.WebApp : null;

            let matchedPlatform = null;
            let matchedSdk = null;

            const tgHasData = Boolean(tg && (tg.initData || (tg.initDataUnsafe && tg.initDataUnsafe.user)));
            const maxHasData = Boolean(max && (max.initData || (max.initDataUnsafe && max.initDataUnsafe.user)));

            if (tgHasData || (tg && this.urlData && this.urlData.hasTgHint && !maxHasData)) {
              matchedPlatform = 'tg';
              matchedSdk = tg;
            } else if (maxHasData || (max && this.urlData && this.urlData.hasMaxHint && !tgHasData)) {
              matchedPlatform = 'max';
              matchedSdk = max;
            }

            if (!matchedSdk) return false;

            this.platform = matchedPlatform;
            this.sdk = matchedSdk;
            this._attached = true;
            this.sdkState = 'ready';
            this.sdkLabel = matchedPlatform === 'tg' ? 'Telegram SDK активен' : 'MAX SDK активен';

            if (typeof matchedSdk.ready === 'function') matchedSdk.ready();
            if (typeof matchedSdk.expand === 'function') matchedSdk.expand();

            // Обновляем chrome и BackButton, если модалка уже открыта
            if (!silent && state) {
              applyTheme();
              if (hasAnyModalOpen()) {
                this.backButton.show(() => closeAllModals());
              }
              const u = this.getUser(state.profile.name);
              if (u.firstName && (state.profile.name === 'Гость' || state.profile.name === 'Пользователь')) {
                state.profile.name = u.firstName;
                saveLocalOnly();
              }
              ui.previewSkin = this.platform === 'max' ? 'max' : 'tg';
              renderShellChrome();
              if (ui.activeTab === 'settings' || ui.activeTab === 'reminders') {
                renderAll();
              }
              handleIncomingStartParam();
              CloudSync.sync(false);
            }
            return true;
          } catch (err) {
            console.warn('attachSdk warning:', err);
            return false;
          }
        },

        getLabel() {
          if (this.platform === 'tg') return 'Telegram';
          if (this.platform === 'max') return 'MAX';
          return 'Web';
        },

        getColorScheme() {
          try {
            if (this.sdk && this.sdk.colorScheme) {
              return this.sdk.colorScheme === 'dark' ? 'dark' : 'light';
            }
          } catch (_) {}
          return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        },

        syncChrome(isDark) {
          try {
            if (!this.sdk) return;
            const hdr = isDark ? '#111A2E' : '#FFFFFF';
            const bg = isDark ? '#0B1120' : '#F3F6FB';
            if (typeof this.sdk.setHeaderColor === 'function') this.sdk.setHeaderColor(hdr);
            if (typeof this.sdk.setBackgroundColor === 'function') this.sdk.setBackgroundColor(bg);
          } catch (_) {}
        },

        getWebId() {
          let id = safeGetStorage(WEB_ID_KEY);
          if (!id) {
            id = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
            safeSetStorage(WEB_ID_KEY, id);
          }
          return id;
        },

        getUser(fallbackName) {
          // 1. Сначала пробуем из привязанного нативного SDK
          try {
            if (this.sdk && this.sdk.initDataUnsafe && this.sdk.initDataUnsafe.user) {
              const u = this.sdk.initDataUnsafe.user;
              const pid = u.id !== undefined && u.id !== null ? String(u.id) : this.getWebId();
              return {
                platform: this.platform,
                platformUserId: pid,
                userKey: `${this.platform}_${pid}`,
                firstName: u.first_name || u.firstName || fallbackName || 'Пользователь'
              };
            }
          } catch (_) {}

          // 2. Мгновенный 0ms фоллбэк из URL/Hash до загрузки SDK
          if (this.urlData && this.urlData.userId && (this.platform === 'tg' || this.platform === 'max')) {
            return {
              platform: this.platform,
              platformUserId: this.urlData.userId,
              userKey: `${this.platform}_${this.urlData.userId}`,
              firstName: this.urlData.firstName || fallbackName || 'Пользователь'
            };
          }

          // 3. Обычный Web / PWA гость
          const wid = this.getWebId();
          return {
            platform: this.platform === 'web' ? 'web' : this.platform,
            platformUserId: wid,
            userKey: `${this.platform === 'web' ? 'web' : this.platform}_${wid}`,
            firstName: (this.urlData && this.urlData.firstName) || fallbackName || 'Гость'
          };
        },

        getStartParam() {
          try {
            if (this.sdk && this.sdk.initDataUnsafe && this.sdk.initDataUnsafe.start_param) {
              return String(this.sdk.initDataUnsafe.start_param);
            }
          } catch (_) {}
          return (this.urlData && this.urlData.startParam) ? this.urlData.startParam : '';
        },

        haptic(type = 'light') {
          try {
            const hf = this.sdk && this.sdk.HapticFeedback ? this.sdk.HapticFeedback : null;
            if (!hf) return;
            if (type === 'success' || type === 'warning' || type === 'error') {
              if (typeof hf.notificationOccurred === 'function') hf.notificationOccurred(type);
            } else if (type === 'selection') {
              if (typeof hf.selectionChanged === 'function') hf.selectionChanged();
            } else {
              if (typeof hf.impactOccurred === 'function') hf.impactOccurred(type);
            }
          } catch (_) {}
        },

        backButton: {
          show(cb) {
            try {
              const bb = PlatformBridge.sdk && PlatformBridge.sdk.BackButton ? PlatformBridge.sdk.BackButton : null;
              if (!bb) return;
              if (PlatformBridge._backCb && typeof bb.offClick === 'function') bb.offClick(PlatformBridge._backCb);
              PlatformBridge._backCb = cb;
              if (typeof bb.onClick === 'function') bb.onClick(cb);
              if (typeof bb.show === 'function') bb.show();
            } catch (_) {}
          },
          hide() {
            try {
              const bb = PlatformBridge.sdk && PlatformBridge.sdk.BackButton ? PlatformBridge.sdk.BackButton : null;
              if (!bb) return;
              if (PlatformBridge._backCb && typeof bb.offClick === 'function') {
                bb.offClick(PlatformBridge._backCb);
                PlatformBridge._backCb = null;
              }
              if (typeof bb.hide === 'function') bb.hide();
            } catch (_) {}
          }
        },

        share(text, url) {
          const combined = url ? `${text}\n${url}` : text;
          try {
            if (this.platform === 'max' && this.sdk) {
              if (typeof this.sdk.shareMaxContent === 'function') { this.sdk.shareMaxContent({ text, link: url || '' }); return; }
              if (typeof this.sdk.shareContent === 'function') { this.sdk.shareContent({ text, link: url || '' }); return; }
            }
            if (this.platform === 'tg' && this.sdk && typeof this.sdk.openTelegramLink === 'function' && url) {
              this.sdk.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`);
              return;
            }
            if (navigator.share) {
              navigator.share({ title: 'СменаPro', text, url: url || undefined }).catch(() => {
                copyTextSafely(combined);
                showToast('Ссылка и код скопированы в буфер обмена', 'success');
              });
              return;
            }
          } catch (_) {}
          const ok = copyTextSafely(combined);
          showToast(ok ? 'Ссылка и код скопированы!' : 'Не удалось скопировать', ok ? 'success' : 'error');
        }
      };

      /**
       * Асинхронный умный загрузчик SDK — вызывается СТРОГО ПОСЛЕ первого рендера UI.
       * Загружает нужный SDK по подсказкам среды (или оба асинхронно при неясной среде),
       * никогда не блокируя интерфейс, + поллинг каждые 150ms (макс. 4с).
       */
      function loadPlatformSdks() {
        const hints = PlatformBridge.urlData || parseUrlLaunchData();
        const scriptsToLoad = [];

        if (hints.hasTgHint && !hints.hasMaxHint) {
          scriptsToLoad.push({ id: 'sdk-tg', src: 'https://telegram.org/js/telegram-web-app.js' });
        } else if (hints.hasMaxHint && !hints.hasTgHint) {
          scriptsToLoad.push({ id: 'sdk-max', src: 'https://st.max.ru/js/max-web-app.js' });
        } else {
          // Среда не определена однозначно — подгружаем оба асинхронно без блокировок
          scriptsToLoad.push({ id: 'sdk-tg', src: 'https://telegram.org/js/telegram-web-app.js' });
          scriptsToLoad.push({ id: 'sdk-max', src: 'https://st.max.ru/js/max-web-app.js' });
        }

        const onSdkTryAttach = () => {
          PlatformBridge.attachSdk(false);
        };

        scriptsToLoad.forEach(item => {
          if (document.getElementById(item.id)) return;
          try {
            const s = document.createElement('script');
            s.id = item.id;
            s.src = item.src;
            s.async = true;
            s.onload = onSdkTryAttach;
            s.onerror = () => {
              if (!PlatformBridge._attached) {
                PlatformBridge.sdkState = PlatformBridge.platform === 'web' ? 'web' : 'fallback';
                PlatformBridge.sdkLabel = PlatformBridge.platform === 'web'
                  ? 'Web / PWA (без SDK)'
                  : '0ms URL-режим (SDK недоступен)';
                if (ui.activeTab === 'settings') renderAll();
              }
            };
            document.head.appendChild(s);
          } catch (_) {}
        });

        // Лёгкий 150ms watcher: останавливается как только SDK привязался или через 4 секунды
        const startedAt = Date.now();
        const watcher = setInterval(() => {
          if (PlatformBridge.attachSdk(false)) {
            clearInterval(watcher);
            return;
          }
          if (Date.now() - startedAt >= 4000) {
            clearInterval(watcher);
            if (!PlatformBridge._attached) {
              PlatformBridge.sdkState = PlatformBridge.platform === 'web' ? 'web' : 'fallback';
              PlatformBridge.sdkLabel = PlatformBridge.platform === 'web'
                ? 'Web / PWA (без SDK)'
                : '0ms URL-режим (фоллбэк)';
              if (ui.activeTab === 'settings') renderAll();
            }
          }
        }, 150);
      }

      // === 6. ОБЛАЧНАЯ СИНХРОНИЗАЦИЯ CloudSync (Supabase REST, строго без Bearer) ===
      const CloudSync = {
        status: 'local', // 'local' | 'syncing' | 'synced' | 'error'
        lastSyncTime: null,
        diagMessage: '',
        diagTone: 'off',
        webhookMessage: '',
        webhookTone: 'off',
        _timer: null,
        _inFlight: false,

        /**
         * КРИТИЧНО: для ключа sb_publishable_... передаём ТОЛЬКО заголовок apikey,
         * НИКОГДА не отправляем Authorization: Bearer (иначе HTTP 401 Invalid JWT).
         */
        _headers(extra = {}) {
          return {
            'apikey': APP_CONFIG.SUPABASE_ANON_KEY,
            'Content-Type': 'application/json',
            ...extra
          };
        },

        _tableUrl(query = '') {
          const base = APP_CONFIG.SUPABASE_URL.replace(/\/+$/, '');
          return `${base}/rest/v1/${encodeURIComponent(APP_CONFIG.SUPABASE_TABLE_USERS)}${query}`;
        },

        _httpErr(status, detail = '') {
          const tbl = APP_CONFIG.SUPABASE_TABLE_USERS;
          if (status === 404) return `Таблица ${tbl} не найдена (HTTP 404).`;
          if (status === 401 || status === 403) return `Нет доступа RLS или ключа (HTTP ${status}).`;
          if (status === 400) return `Ошибка запроса (HTTP 400)${detail ? ': ' + detail.slice(0, 90) : ''}`;
          return `Ошибка Supabase (HTTP ${status})`;
        },

        scheduleUpsert() {
          clearTimeout(this._timer);
          this._timer = setTimeout(() => {
            this.pushState(false);
          }, 800);
        },

        buildPushConfig() {
          let hoursBefore = 24;
          if (state.notifications.mode === '12h') {
            hoursBefore = 12;
          } else if (state.notifications.mode === 'prev_evening') {
            const [sh, sm] = (state.schedule.defaultStartTime || '08:00').split(':').map(Number);
            const [ch, cm] = (state.notifications.customTime || '19:00').split(':').map(Number);
            const diffH = (24 - (ch + cm / 60)) + (sh + sm / 60);
            hoursBefore = Math.max(1, Math.round(diffH));
          }
          return {
            hoursBefore,
            mode: state.notifications.mode,
            customTime: state.notifications.customTime || '19:00'
          };
        },

        buildUserPayload() {
          const user = PlatformBridge.getUser(state.profile.name);
          const nextShiftAt = computeNextShiftAtISO();
          const tz = state.notifications.timezone || APP_CONFIG.DEFAULT_TIMEZONE;

          return {
            user_key: user.userKey,
            platform: user.platform,
            platform_user_id: user.platformUserId,
            display_name: state.profile.name || user.firstName,
            sync_code: state.profile.syncCode,
            timezone: tz,
            schedule_config: {
              preset: state.schedule.preset,
              cycle: state.schedule.cycle,
              startDate: state.schedule.startDate,
              defaultHours: state.schedule.defaultHours,
              defaultStartTime: state.schedule.defaultStartTime,
              payMode: state.schedule.payMode,
              shiftRate: state.schedule.shiftRate,
              hourlyRate: state.schedule.hourlyRate,
              nightBonus: state.schedule.nightBonus,
              overtimeThreshold: state.schedule.overtimeThreshold,
              overtimeMultiplier: state.schedule.overtimeMultiplier
            },
            overrides: state.overrides,
            checklist: state.checklist,
            push_enabled: Boolean(state.notifications.enabled),
            push_config: this.buildPushConfig(),
            next_shift_at: nextShiftAt,
            updated_at: state.updatedAt || new Date().toISOString()
          };
        },

        /**
         * Неблокирующая фоновая синхронизация (Pull -> слияние, или Push) с таймаутом 8с
         */
        async sync(forcePush = false) {
          if (this._inFlight) return;
          this._inFlight = true;
          try {
            if (forcePush) {
              await this.pushState(true);
              return;
            }
            const user = PlatformBridge.getUser(state.profile.name);
            const res = await fetchWithTimeout(
              this._tableUrl(`?user_key=eq.${encodeURIComponent(user.userKey)}&limit=1`),
              { method: 'GET', headers: this._headers() },
              8000
            );
            if (!res.ok) {
              this.status = 'error';
              this.diagMessage = this._httpErr(res.status);
              this.diagTone = 'err';
              updateCloudBadge();
              return;
            }
            const rows = await res.json();
            if (Array.isArray(rows) && rows[0]) {
              const cloud = rows[0];
              const cloudTs = cloud.updated_at ? Date.parse(cloud.updated_at) : 0;
              const localTs = state.updatedAt ? Date.parse(state.updatedAt) : 0;

              if (cloudTs > localTs && cloud.schedule_config && cloud.schedule_config.preset) {
                state.profile.name = cloud.display_name || state.profile.name;
                state.profile.syncCode = cloud.sync_code || state.profile.syncCode;
                state.schedule = { ...state.schedule, ...cloud.schedule_config };
                if (cloud.overrides && typeof cloud.overrides === 'object') state.overrides = cloud.overrides;
                if (Array.isArray(cloud.checklist) && cloud.checklist.length) state.checklist = cloud.checklist;
                state.notifications.enabled = typeof cloud.push_enabled === 'boolean' ? cloud.push_enabled : state.notifications.enabled;
                if (cloud.timezone) state.notifications.timezone = cloud.timezone;
                if (cloud.push_config && typeof cloud.push_config === 'object') {
                  state.notifications.mode = cloud.push_config.mode || state.notifications.mode;
                  state.notifications.customTime = cloud.push_config.customTime || state.notifications.customTime;
                }
                state.updatedAt = cloud.updated_at;
                saveLocalOnly();
                renderAll();
              } else if (localTs > cloudTs) {
                this._inFlight = false;
                await this.pushState(false);
                return;
              }
              const now = new Date();
              this.status = 'synced';
              this.lastSyncTime = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
              this.diagMessage = `Синхронизировано (${this.lastSyncTime}) • ${user.userKey}`;
              this.diagTone = 'ok';
              updateCloudBadge();
              if (ui.activeTab === 'settings') renderAll();
            } else {
              this._inFlight = false;
              await this.pushState(false);
              return;
            }
          } catch (_) {
            this.status = 'local';
            updateCloudBadge();
          } finally {
            this._inFlight = false;
          }
        },

        async pushState(showFeedback = false) {
          this.status = 'syncing';
          updateCloudBadge();

          try {
            const payload = this.buildUserPayload();
            const res = await fetchWithTimeout(
              this._tableUrl('?on_conflict=user_key'),
              {
                method: 'POST',
                headers: this._headers({ 'Prefer': 'resolution=merge-duplicates,return=representation' }),
                body: JSON.stringify(payload)
              },
              8000
            );

            if (!res.ok) {
              let detail = '';
              try { const j = await res.json(); detail = j.message || j.details || ''; } catch (_) {}
              const msg = this._httpErr(res.status, detail);
              this.status = 'error';
              this.diagMessage = msg;
              this.diagTone = 'err';
              updateCloudBadge();
              if (showFeedback) showToast(msg, 'error');
              return { ok: false, message: msg };
            }

            const now = new Date();
            const tStr = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
            this.status = 'synced';
            this.lastSyncTime = tStr;
            this.diagMessage = `Сохранено в Supabase (${tStr}) • ${payload.user_key}`;
            this.diagTone = 'ok';
            updateCloudBadge();
            if (showFeedback) showToast('Синхронизировано с Supabase!', 'success');
            return { ok: true, message: this.diagMessage };
          } catch (err) {
            const isAbort = err && err.name === 'AbortError';
            const msg = isAbort ? 'Таймаут Supabase (8с) — данные сохранены локально.' : 'Нет связи с Supabase (данные сохранены локально).';
            this.status = 'error';
            this.diagMessage = msg;
            this.diagTone = 'err';
            updateCloudBadge();
            if (showFeedback) showToast(msg, 'warning');
            return { ok: false, message: msg };
          }
        },

        async testConnection() {
          this.status = 'syncing';
          this.diagMessage = 'Проверяем соединение с Supabase...';
          this.diagTone = 'warn';
          updateCloudBadge();
          if (ui.activeTab === 'settings') renderAll();

          try {
            const res = await fetchWithTimeout(
              this._tableUrl('?select=user_key&limit=1'),
              { method: 'GET', headers: this._headers() },
              8000
            );
            if (res.ok) {
              const now = new Date();
              const tStr = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
              this.status = 'synced';
              this.lastSyncTime = tStr;
              this.diagMessage = `Связь OK! Таблица ${APP_CONFIG.SUPABASE_TABLE_USERS} доступна (HTTP ${res.status}, ${tStr}).`;
              this.diagTone = 'ok';
              updateCloudBadge();
              return { ok: true, message: this.diagMessage };
            }
            let detail = '';
            try { const j = await res.json(); detail = j.message || ''; } catch (_) {}
            const msg = this._httpErr(res.status, detail);
            this.status = 'error';
            this.diagMessage = msg;
            this.diagTone = 'err';
            updateCloudBadge();
            return { ok: false, message: msg };
          } catch (_) {
            const msg = 'Не удалось подключиться к Supabase (таймаут или нет сети).';
            this.status = 'error';
            this.diagMessage = msg;
            this.diagTone = 'err';
            updateCloudBadge();
            return { ok: false, message: msg };
          }
        },

        async fetchPartnerBySyncCode(code) {
          try {
            const clean = encodeURIComponent(code.trim().toUpperCase());
            const res = await fetchWithTimeout(
              this._tableUrl(`?sync_code=eq.${clean}&select=display_name,platform,schedule_config,overrides&limit=1`),
              { method: 'GET', headers: this._headers() },
              8000
            );
            if (!res.ok) return { ok: false, message: this._httpErr(res.status) };
            const rows = await res.json();
            if (!Array.isArray(rows) || !rows.length) {
              return { ok: false, message: `Код ${code.toUpperCase()} не найден в облаке.` };
            }
            return { ok: true, data: rows[0] };
          } catch (_) {
            return { ok: false, message: 'Ошибка сети при поиске кода в Supabase.' };
          }
        },

        async sendTestPush() {
          const user = PlatformBridge.getUser(state.profile.name);
          const payload = {
            user_key: user.userKey,
            platform: user.platform,
            platform_user_id: user.platformUserId,
            display_name: state.profile.name || user.firstName,
            timezone: state.notifications.timezone || APP_CONFIG.DEFAULT_TIMEZONE,
            next_shift_at: computeNextShiftAtISO(),
            checklist: state.checklist,
            push_config: this.buildPushConfig()
          };

          this.webhookMessage = 'Отправляем запрос на Edge Function smena-push...';
          this.webhookTone = 'warn';
          renderAll();

          try {
            const res = await fetchWithTimeout(
              APP_CONFIG.PUSH_WEBHOOK_URL,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              },
              10000
            );
            const rawText = await res.text();
            let data = null;
            try { data = JSON.parse(rawText); } catch (_) {}

            if (res.ok && data && data.ok === true) {
              this.webhookMessage = `Тестовый пуш успешно отправлен в ${PlatformBridge.getLabel()}!`;
              this.webhookTone = 'ok';
              PlatformBridge.haptic('success');
              showToast(`Тестовый пуш отправлен в ${PlatformBridge.getLabel()}!`, 'success');
            } else {
              const exactErr =
                (data && (data.error || data.message || (data.result && (data.result.error || data.result.description)))) ||
                `HTTP ${res.status}`;
              this.webhookMessage = `Ошибка отправки: ${exactErr}`;
              this.webhookTone = 'err';
              PlatformBridge.haptic('warning');
              showToast(exactErr, 'warning');
            }
          } catch (err) {
            const isAbort = err && err.name === 'AbortError';
            this.webhookMessage = isAbort
              ? 'Таймаут ответа от smena-push (10с). Повторите попытку.'
              : 'Не удалось связаться с smena-push (проверьте сеть, деплой Edge Function и Verify JWT = OFF).';
            this.webhookTone = 'err';
            PlatformBridge.haptic('error');
            showToast('Нет связи с сервером пушей', 'error');
          }
          renderAll();
        }
      };

      // === 7. КОДЫ СИНХРОНИЗАЦИИ И ДИПЛИНКИ (TG <-> MAX) ===
      function buildDeepLinks(code) {
        const tgLink = APP_CONFIG.TG_APP_SHORT_NAME
          ? `https://t.me/${APP_CONFIG.TG_BOT_USERNAME}/${APP_CONFIG.TG_APP_SHORT_NAME}?startapp=sync_${code}`
          : `https://t.me/${APP_CONFIG.TG_BOT_USERNAME}?startapp=sync_${code}`;
        const maxLink = `https://max.ru/${APP_CONFIG.MAX_BOT_USERNAME}?startapp=sync_${code}`;
        return { tgLink, maxLink };
      }

      function encodeOfflineCode(name, sched) {
        try {
          const mapC = { full24: 'f', day: 'd', night: 'n', off: 'o', recovery: 'r', vacation: 'v', sick: 's' };
          const obj = {
            n: (name || 'Партнёр').slice(0, 20),
            p: sched.preset || '1/3',
            s: sched.startDate || getTodayISO()
          };
          if (sched.preset === 'custom' && Array.isArray(sched.cycle)) {
            obj.c = sched.cycle.map(t => mapC[t] || 'o').join('');
          }
          const utf8 = unescape(encodeURIComponent(JSON.stringify(obj)));
          const b64 = btoa(utf8).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
          return `SM1_${b64}`;
        } catch (_) {
          return '';
        }
      }

      function decodeOfflineCode(raw) {
        try {
          let clean = String(raw || '').trim();
          if (clean.startsWith('sync_')) clean = clean.slice(5);
          if (!clean.startsWith('SM1_')) return null;
          let b64 = clean.slice(4).replace(/-/g, '+').replace(/_/g, '/');
          while (b64.length % 4) b64 += '=';
          const obj = JSON.parse(decodeURIComponent(escape(atob(b64))));
          if (!obj || !obj.p) return null;
          const rev = { f: 'full24', d: 'day', n: 'night', o: 'off', r: 'recovery', v: 'vacation', s: 'sick' };
          const cycle = typeof obj.c === 'string'
            ? obj.c.split('').map(ch => rev[ch] || 'off')
            : (PRESETS[obj.p] ? PRESETS[obj.p].cycle.slice() : ['full24', 'off', 'off', 'off']);
          return {
            name: String(obj.n || 'Партнёр').slice(0, 24),
            preset: PRESETS[obj.p] ? obj.p : '1/3',
            startDate: /^\d{4}-\d{2}-\d{2}$/.test(obj.s) ? obj.s : getTodayISO(),
            cycle,
            overrides: {}
          };
        } catch (_) {
          return null;
        }
      }

      // === 8. СОСТОЯНИЕ ПРИЛОЖЕНИЯ (С БЕЗОПАСНОЙ СХЕМОЙ ПО УМОЛЧАНИЮ) ===
      function createDefaultState() {
        const tz = APP_CONFIG.DEFAULT_TIMEZONE;
        const today = getTodayISO(tz);
        const tomorrow = addDaysISO(today, 1);
        const u = PlatformBridge.getUser('Гость');

        return {
          updatedAt: new Date().toISOString(),
          themeMode: 'auto', // 'auto' | 'light' | 'dark'
          profile: {
            name: u.firstName || 'Гость',
            syncCode: generateSyncCode()
          },
          schedule: {
            preset: '1/3',
            cycle: ['full24', 'off', 'off', 'off'],
            startDate: tomorrow,
            defaultHours: 24,
            defaultStartTime: '08:00',
            payMode: 'shift', // 'shift' | 'hour'
            shiftRate: 6800,
            hourlyRate: 350,
            nightBonus: 20,
            overtimeThreshold: 160,
            overtimeMultiplier: 1.5
          },
          partner: {
            enabled: false,
            name: 'Супруга',
            code: '',
            preset: '5/2',
            cycle: PRESETS['5/2'].cycle.slice(),
            startDate: today,
            overrides: {}
          },
          overrides: {},
          notifications: {
            enabled: true,
            mode: '24h', // '24h' | '12h' | 'prev_evening'
            customTime: '19:00',
            timezone: tz
          },
          checklist: [
            { id: 'c1', text: 'Форма и сменная обувь', checked: false },
            { id: 'c2', text: 'Документы и пропуск', checked: false },
            { id: 'c3', text: 'Зарядка и пауэрбанк', checked: false },
            { id: 'c4', text: 'Еда и вода на смену', checked: false },
            { id: 'c5', text: 'Аптечка / личные мелочи', checked: false }
          ]
        };
      }

      function loadState() {
        const def = createDefaultState();
        try {
          let raw = safeGetStorage(STORAGE_KEY);
          if (!raw) {
            for (const k of LEGACY_KEYS) {
              raw = safeGetStorage(k);
              if (raw) break;
            }
          }
          if (!raw) return def;
          const p = JSON.parse(raw);
          if (!p || typeof p !== 'object') return def;

          const merged = {
            ...def,
            ...p,
            profile: { ...def.profile, ...(p.profile && typeof p.profile === 'object' ? p.profile : {}) },
            schedule: { ...def.schedule, ...(p.schedule && typeof p.schedule === 'object' ? p.schedule : {}) },
            partner: { ...def.partner, ...(p.partner && typeof p.partner === 'object' ? p.partner : {}) },
            notifications: { ...def.notifications, ...(p.notifications && typeof p.notifications === 'object' ? p.notifications : {}) },
            overrides: (p.overrides && typeof p.overrides === 'object') ? p.overrides : {},
            checklist: Array.isArray(p.checklist) ? p.checklist : def.checklist
          };

          if (!Array.isArray(merged.schedule.cycle) || !merged.schedule.cycle.length) {
            merged.schedule.cycle = (PRESETS[merged.schedule.preset] || PRESETS['1/3']).cycle.slice();
          }
          if (!/^\d{4}-\d{2}-\d{2}$/.test(merged.schedule.startDate || '')) {
            merged.schedule.startDate = def.schedule.startDate;
          }

          const u = PlatformBridge.getUser();
          if (PlatformBridge.platform !== 'web' && u.firstName && merged.profile.name === 'Гость') {
            merged.profile.name = u.firstName;
          }
          if (!merged.profile.syncCode) merged.profile.syncCode = generateSyncCode();
          return merged;
        } catch (_) {
          return def;
        }
      }

      let state = null;

      function saveLocalOnly() {
        try { safeSetStorage(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
      }

      function saveState() {
        state.updatedAt = new Date().toISOString();
        saveLocalOnly();
        CloudSync.scheduleUpsert();
      }

      const initNow = new Date();
      const ui = {
        activeTab: 'calendar', // 'calendar' | 'stats' | 'reminders' | 'settings'
        calendarMode: 'month', // 'month' | 'year'
        viewYear: initNow.getFullYear(),
        viewMonth: initNow.getMonth(),
        selectedDate: null,
        statsScope: 'month',   // 'month' | 'year'
        statsMetric: 'income', // 'income' | 'hours'
        selectedChartMonth: initNow.getMonth(),
        previewSkin: 'tg',     // 'tg' | 'max'
        // Модальные окна
        editingDate: null,
        showCustomCycleModal: false,
        customCycleDraft: [],
        customCycleStartDate: '',
        customCycleHours: 12,
        customCyclePayMode: 'shift',
        customCycleRate: 6800,

      // === 9. ДВИЖОК ГОДОВОГО ГРАФИКА, ДОХОДА И NEXT_SHIFT_AT ===
      function getBaseShiftType(dateStr, schedObj) {
        const preset = schedObj.preset || '1/3';
        if (preset === '5/2') {
          const [y, m, d] = dateStr.split('-').map(Number);
          const dow = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
          return (dow === 0 || dow === 6) ? 'off' : 'day';
        }
        let cycle;
        if (preset === 'custom') {
          cycle = (Array.isArray(schedObj.cycle) && schedObj.cycle.length) ? schedObj.cycle : ['day', 'off'];
        } else {
          cycle = (PRESETS[preset] && PRESETS[preset].cycle) ? PRESETS[preset].cycle : ['full24', 'off', 'off', 'off'];
        }
        const delta = diffDays(dateStr, schedObj.startDate || getTodayISO());
        const len = cycle.length;
        const idx = ((delta % len) + len) % len;
        return SHIFT_TYPES[cycle[idx]] ? cycle[idx] : 'off';
      }

      function getStandardHours(type) {
        const s = state.schedule;
        if (!SHIFT_TYPES[type] || !SHIFT_TYPES[type].work) return 0;
        if (type === 'full24') return s.preset === '1/3' ? (Number(s.defaultHours) || 24) : 24;
        if (s.preset === '1/3') return 12;
        return Number(s.defaultHours) || SHIFT_TYPES[type].defaultHours;
      }

      function getDayInfo(dateStr) {
        const s = state.schedule;
        const baseType = getBaseShiftType(dateStr, s);
        const baseMeta = SHIFT_TYPES[baseType] || SHIFT_TYPES.off;
        const baseStart = !baseMeta.work ? '00:00' : (baseType === 'night' ? '20:00' : (s.defaultStartTime || baseMeta.defaultStart));
        const baseHours = baseMeta.work ? getStandardHours(baseType) : 0;
        const baseEnd = baseMeta.work ? computeEndTime(baseStart, baseHours) : '00:00';

        const ov = state.overrides[dateStr];
        if (!ov) {
          return { date: dateStr, type: baseType, hours: baseHours, startTime: baseStart, endTime: baseEnd, bonus: 0, note: '', isOverride: false };
        }
        const type = SHIFT_TYPES[ov.type] ? ov.type : baseType;
        const meta = SHIFT_TYPES[type];
        const startTime = ov.startTime || (type === 'night' ? '20:00' : (s.defaultStartTime || '08:00'));
        const hours = meta.work ? (Number(ov.hours) >= 0 ? Number(ov.hours) : baseHours) : 0;
        const endTime = ov.endTime || (meta.work ? computeEndTime(startTime, hours) : '00:00');
        return {
          date: dateStr,
          type,
          hours,
          startTime,
          endTime,
          bonus: Number(ov.bonus) || 0,
          note: ov.note || '',
          isOverride: true
        };
      }

      function getPartnerDayType(dateStr) {
        if (!state.partner.enabled) return null;
        if (state.partner.overrides && state.partner.overrides[dateStr] && state.partner.overrides[dateStr].type) {
          return state.partner.overrides[dateStr].type;
        }
        return getBaseShiftType(dateStr, state.partner);
      }

      function isDayFreeType(t) {
        return t === 'off' || t === 'recovery' || t === 'vacation';
      }

      function isCommonDayOff(dateStr) {
        if (!state.partner.enabled) return false;
        return isDayFreeType(getDayInfo(dateStr).type) && isDayFreeType(getPartnerDayType(dateStr));
      }

      function calculateDayPay(dayInfo) {
        const s = state.schedule;
        const meta = SHIFT_TYPES[dayInfo.type] || SHIFT_TYPES.off;
        const bonus = Number(dayInfo.bonus) || 0;
        if (!meta.work || dayInfo.hours <= 0) {
          return { pay: Math.round(bonus), basePay: 0, nightAdd: 0, bonus, hourlyEq: 0, hours: 0, isWork: false };
        }

        const stdH = getStandardHours(dayInfo.type) || dayInfo.hours;
        const hourlyEq = s.payMode === 'hour'
          ? (Number(s.hourlyRate) || 0)
          : (stdH > 0 ? (Number(s.shiftRate) || 0) / stdH : (Number(s.shiftRate) || 0));

        const basePay = hourlyEq * dayInfo.hours;
        const nightPct = Number(s.nightBonus) || 0;
        let nightAdd = 0;
        if (nightPct > 0) {
          if (dayInfo.type === 'night') nightAdd = basePay * (nightPct / 100);
          else if (dayInfo.type === 'full24') nightAdd = (Math.min(8, dayInfo.hours) * hourlyEq) * (nightPct / 100);
        }

        return {
          pay: Math.round(basePay + nightAdd + bonus),
          basePay: Math.round(basePay),
          nightAdd: Math.round(nightAdd),
          bonus: Math.round(bonus),
          hourlyEq,
          hours: dayInfo.hours,
          isWork: true
        };
      }

      function getMonthStats(year, month0) {
        const days = getDaysInMonth(year, month0);
        const todayStr = getTodayISO(state.notifications.timezone);
        let shifts = 0, completedShifts = 0, totalHours = 0, baseIncome = 0, nightTotal = 0, bonusTotal = 0, sharedOff = 0;
        let avgHourlyAcc = 0;

        for (let d = 1; d <= days; d++) {
          const iso = formatDateISO(year, month0, d);
          const info = getDayInfo(iso);
          const m = calculateDayPay(info);
          if (isCommonDayOff(iso)) sharedOff++;
          if (m.isWork) {
            shifts++;
            if (iso <= todayStr) completedShifts++;
            totalHours += m.hours;
            avgHourlyAcc += m.hourlyEq;
          }
          baseIncome += m.pay;
          nightTotal += m.nightAdd;
          bonusTotal += m.bonus;
        }

        const threshold = Number(state.schedule.overtimeThreshold) || 160;
        const otMult = Math.max(1, Number(state.schedule.overtimeMultiplier) || 1.5);
        const overtimeHours = Math.max(0, totalHours - threshold);
        const avgHourly = shifts > 0 ? (avgHourlyAcc / shifts) : (Number(state.schedule.hourlyRate) || 0);
        const overtimeExtraPay = Math.round(overtimeHours * avgHourly * (otMult - 1));

        return {
          shifts,
          completedShifts,
          totalHours: Math.round(totalHours * 10) / 10,
          overtimeHours: Math.round(overtimeHours * 10) / 10,
          totalIncome: baseIncome + overtimeExtraPay,
          overtimeExtraPay,
          nightTotal,
          bonusTotal,
          sharedOff
        };
      }

      function getYearStats(year) {
        const months = [];
        let shifts = 0, completedShifts = 0, totalHours = 0, overtimeHours = 0, totalIncome = 0, overtimeExtraPay = 0, nightTotal = 0, bonusTotal = 0, sharedOff = 0;
        for (let m = 0; m < 12; m++) {
          const st = getMonthStats(year, m);
          months.push(st);
          shifts += st.shifts;
          completedShifts += st.completedShifts;
          totalHours += st.totalHours;
          overtimeHours += st.overtimeHours;
          totalIncome += st.totalIncome;
          overtimeExtraPay += st.overtimeExtraPay;
          nightTotal += st.nightTotal;
          bonusTotal += st.bonusTotal;
          sharedOff += st.sharedOff;
        }
        return {
          months,
          shifts,
          completedShifts,
          totalHours: Math.round(totalHours * 10) / 10,
          overtimeHours: Math.round(overtimeHours * 10) / 10,
          totalIncome,
          overtimeExtraPay,
          nightTotal,
          bonusTotal,
          sharedOff
        };
      }

      function computeLiveStatus() {
        const nowMs = Date.now();
        const tz = state.notifications.timezone || APP_CONFIG.DEFAULT_TIMEZONE;
        const todayStr = getTodayISO(tz);
        const yestStr = addDaysISO(todayStr, -1);

        for (const checkStr of [yestStr, todayStr]) {
          const info = getDayInfo(checkStr);
          if (SHIFT_TYPES[info.type] && SHIFT_TYPES[info.type].work && info.hours > 0) {
            const startMs = shiftToUtcMs(checkStr, info.startTime, tz);
            const endMs = startMs + info.hours * 3600000;
            if (nowMs >= startMs && nowMs < endMs) {
              const pct = Math.min(100, Math.max(2, Math.round(((nowMs - startMs) / (endMs - startMs)) * 100)));
              return {
                onShift: true,
                current: info,
                endMs,
                remMs: endMs - nowMs,
                pct,
                next: findNextShift(nowMs, addDaysISO(checkStr, 1), tz)
              };
            }
          }
        }

        return {
          onShift: false,
          current: null,
          next: findNextShift(nowMs, todayStr, tz)
        };
      }

      function findNextShift(nowMs, fromIso, tz) {
        const todayStr = getTodayISO(tz);
        const tomorrowStr = addDaysISO(todayStr, 1);

        for (let i = 0; i <= 120; i++) {
          const iso = addDaysISO(fromIso, i);
          const info = getDayInfo(iso);
          if (SHIFT_TYPES[info.type] && SHIFT_TYPES[info.type].work && info.hours > 0) {
            const startMs = shiftToUtcMs(iso, info.startTime, tz);
            if (startMs > nowMs) {
              const diffMs = startMs - nowMs;
              const diffHours = diffMs / 3600000;
              return {
                info,
                startMs,
                startISO: new Date(startMs).toISOString(),
                diffMs,
                diffHours,
                isToday: iso === todayStr,
                isTomorrow: iso === tomorrowStr,
                within24h: diffHours > 0 && diffHours <= 24
              };
            }
          }
        }
        return null;
      }

      function computeNextShiftAtISO() {
        const live = computeLiveStatus();
        return live.next ? live.next.startISO : null;
      }

      function formatDuration(ms) {
        const totalMin = Math.max(1, Math.floor(ms / 60000));
        const d = Math.floor(totalMin / 1440);
        const h = Math.floor((totalMin % 1440) / 60);
        const m = totalMin % 60;
        if (d > 0) return `${d} д. ${h} ч. ${m} м.`;
        if (h > 0) return `${h} ч. ${m} м.`;
        return `${m} мин.`;
      }

      function getNextPushLabel(nextObj) {
        if (!nextObj) return 'Нет запланированных смен';
        const n = state.notifications;
        const tz = n.timezone || APP_CONFIG.DEFAULT_TIMEZONE;
        let notifyMs;
        if (n.mode === '24h') {
          notifyMs = nextObj.startMs - 24 * 3600000;
        } else if (n.mode === '12h') {
          notifyMs = nextObj.startMs - 12 * 3600000;
        } else {
          notifyMs = shiftToUtcMs(addDaysISO(nextObj.info.date, -1), n.customTime || '19:00', tz);
        }
        const iso = formatDateInTz(notifyMs, tz);
        const timeStr = formatTimeInTz(notifyMs, tz);
        const todayStr = getTodayISO(tz);
        const tomorrowStr = addDaysISO(todayStr, 1);
        const dayLbl = iso === todayStr ? 'Сегодня' : iso === tomorrowStr ? 'Завтра' : formatShortDate(iso);
        return `${dayLbl} в ${timeStr}`;
      }

      // === 10. ТЕМА, ТОСТЫ И БЕЙДЖ ОБЛАКА ===
      function isDarkThemeActive() {
        if (state.themeMode === 'dark') return true;
        if (state.themeMode === 'light') return false;
        return PlatformBridge.getColorScheme() === 'dark';
      }

      function applyTheme() {
        const dark = isDarkThemeActive();
        document.documentElement.classList.toggle('dark', dark);
        PlatformBridge.syncChrome(dark);
      }

      function showToast(msg, type = 'info') {
        const stack = document.getElementById('toastStack');
        if (!stack) return;
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        const ic = type === 'success' ? 'check' : type === 'error' ? 'x' : type === 'warning' ? 'bell' : 'info';
        el.innerHTML = `${svgIcon(ic, 16)}<span>${escapeHtml(msg)}</span>`;
        stack.appendChild(el);
        setTimeout(() => {
          el.style.transition = 'opacity 0.2s ease, transform 0.2s ease';
          el.style.opacity = '0';
          el.style.transform = 'translateY(-8px)';
          setTimeout(() => el.remove(), 220);
        }, 3200);
      }

      function updateCloudBadge() {
        const dot = document.getElementById('cloudDot');
        const lbl = document.getElementById('cloudLabel');
        if (!dot || !lbl) return;
        dot.className = 'cloud-dot';
        if (CloudSync.status === 'synced') {
          dot.classList.add('synced');
          lbl.textContent = CloudSync.lastSyncTime ? `Облако • ${CloudSync.lastSyncTime}` : 'Облако OK';
        } else if (CloudSync.status === 'syncing') {
          dot.classList.add('syncing');
          lbl.textContent = 'Синхр...';
        } else if (CloudSync.status === 'error') {
          dot.classList.add('error');
          lbl.textContent = 'Офлайн';
        } else {
          lbl.textContent = 'Локально';
        }
      }

      // === 11. РЕНДЕР ШАПКИ, АЛЕРТА 24Ч И НИЖНЕЙ НАВИГАЦИИ ===
      function renderShellChrome() {
        const dark = isDarkThemeActive();
        document.getElementById('brandLogo').innerHTML = svgIcon('calendarClock', 21);

        updateCloudBadge();

        const tz = state.notifications.timezone || APP_CONFIG.DEFAULT_TIMEZONE;
        const live = computeLiveStatus();
        const statusBox = document.getElementById('liveStatusBox');
        const bannerBox = document.getElementById('urgentBannerBox');

        if (live.onShift) {
          const m = SHIFT_TYPES[live.current.type];
          const endStr = formatTimeInTz(live.endMs, tz);
          statusBox.innerHTML = `
            <div class="status-pill live">

                  <div class="status-main">Сейчас на смене • ${m.name}</div>
                  <div class="status-sub">Осталось ${formatDuration(live.remMs)} (до ${endStr}) • ${live.pct}%</div>
                  <div class="status-progress"><div style="width:${live.pct}%"></div></div>
                </div>
              </div>
              <button type="button" class="mini-chip-btn" data-action="edit-day" data-date="${live.current.date}">Детали</button>
            </div>
          `;
        } else if (live.next) {
          const ns = live.next;
          const m = SHIFT_TYPES[ns.info.type];
          const dayWord = ns.isToday ? 'Сегодня' : ns.isTomorrow ? 'Завтра' : formatShortDate(ns.info.date);
          statusBox.innerHTML = `
            <div class="status-pill ${ns.within24h ? 'urgent' : ''}">

        } else {
          statusBox.innerHTML = `<div class="status-pill"><div class="status-sub">Ближайшие смены не запланированы</div></div>`;
        }

        const showUrgent = !live.onShift && live.next && (live.next.within24h || live.next.isTomorrow);
        if (showUrgent && ui.activeTab !== 'reminders') {
          const ns = live.next;
          const m = SHIFT_TYPES[ns.info.type];
          const done = state.checklist.filter(i => i.checked).length;
          const total = state.checklist.length;
          bannerBox.className = 'alert-wrap';
          bannerBox.innerHTML = `

                  <div style="font-size:14px;font-weight:900;line-height:1.2;">${ns.isTomorrow ? 'Завтра на смену!' : 'Скоро на смену!'} (${formatDuration(ns.diffMs)})</div>
                  <div style="font-size:12px;opacity:.92;margin-top:2px;">${m.name} в ${ns.info.startTime} • чек-лист: ${done}/${total}</div>
                  <div style="font-size:11px;font-weight:800;margin-top:4px;text-decoration:underline;">Проверить чек-лист сборов</div>
                </div>
              </div>
              <div style="flex-shrink:0;">${svgIcon('chevRight', 20)}</div>
            </button>

        } else {

        const tabs = [
          { id: 'calendar',  icon: 'calendar', label: 'Календарь' },

          btn.innerHTML = `${t.dot ? '<span class="tab-badge-dot"></span>' : ''}${svgIcon(t.icon, 20)}<span>${t.label}</span>`;
        });

      // === 12. ВКЛАДКА 1: КАЛЕНДАРЬ (МЕСЯЦ + ГОД + БЫСТРАЯ ПАНЕЛЬ + ПАРТНЁР) ===
      function renderCalendarTab() {

          <!-- Совместные выходные -->
          <div class="partner-bar ${p.enabled ? 'active' : ''}">
            <div style="display:flex;align-items:center;gap:9px;min-width:0;flex:1;">
              <div style="width:34px;height:34px;border-radius:11px;background:var(--emerald-soft);color:var(--emerald);display:flex;align-items:center;justify-content:center;flex-shrink:0;">

            </div>
          </div>

            <div class="segmented">
              <button type="button" class="segmented-btn ${isMonth ? 'active' : ''}" data-action="cal-mode" data-mode="month">Месяц</button>
              <button type="button" class="segmented-btn ${!isMonth ? 'active' : ''}" data-action="cal-mode" data-mode="year">Год (${ui.viewYear})</button>
            </div>

            <div class="period-nav">
              <button type="button" class="icon-btn" data-action="cal-prev" aria-label="Предыдущий период">${svgIcon('chevLeft', 18)}</button>

                <div class="period-title">${isMonth ? `${MONTHS_RU[ui.viewMonth]} ${ui.viewYear}` : `${ui.viewYear} год`}</div>

        html += isMonth ? renderMonthGrid() : renderYearGrid();

        html += `
          <div class="card">
            <div class="legend-wrap">
              ${['full24', 'day', 'night', 'recovery', 'off', 'vacation', 'sick'].map(id => {
                const m = SHIFT_TYPES[id];
                return `<span class="legend-chip"><span class="legend-dot" style="background:${m.colorVar}"></span>${m.name}</span>`;
              }).join('')}
              <span class="legend-chip"><span class="legend-dot" style="background:#F97316"></span>Правка</span>
              ${p.enabled ? `<span class="legend-chip" style="color:var(--emerald);background:var(--emerald-soft);"><span class="legend-dot" style="background:var(--emerald-bright)"></span>Общий вых.</span>` : ''}
            </div>
          </div>
        `;

        return html;
      }

      function renderMonthGrid() {
        const y = ui.viewYear, m0 = ui.viewMonth;
        const days = getDaysInMonth(y, m0);
        const first = getDowMon0(y, m0, 1);
        const todayStr = getTodayISO(state.notifications.timezone);

        let cells = '';
        for (let i = 0; i < first; i++) cells += '<div></div>';

        for (let d = 1; d <= days; d++) {
          const iso = formatDateISO(y, m0, d);
          const info = getDayInfo(iso);
          const meta = SHIFT_TYPES[info.type] || SHIFT_TYPES.off;
          const isToday = iso === todayStr;
          const commonOff = isCommonDayOff(iso);
          const tag = meta.work ? `${info.hours}ч` : meta.short;

          cells += `
            <button type="button" class="day-cell type-${info.type} ${isToday ? 'is-today' : ''} ${commonOff ? 'common-off' : ''}" data-action="edit-day" data-date="${iso}">
              ${info.isOverride ? '<span class="dot-override" title="Изменено вручную"></span>' : ''}
              ${info.note ? '<span class="dot-note" title="Есть заметка"></span>' : ''}
              <span class="day-num">${d}</span>
              <span class="day-tag">${tag}</span>
              <span class="day-dots">
                ${Number(info.bonus) !== 0 ? `<span style="width:5px;height:5px;border-radius:50%;background:${info.bonus > 0 ? '#F59E0B' : '#E11D48'};"></span>` : ''}
              </span>
              ${commonOff ? '<span class="corner-shared" title="Совместный выходной"></span>' : ''}
            </button>
          `;
        }

        return `
          <div class="card" style="padding:11px;">
            <div class="weekdays-row">
              ${WEEKDAYS_SHORT.map((w, i) => `<div class="weekday-cell ${i >= 5 ? 'weekend' : ''}">${w}</div>`).join('')}
            </div>
            <div class="month-grid">${cells}</div>
          </div>
        `;
      }

      function renderYearGrid() {
        const y = ui.viewYear;
        const todayStr = getTodayISO(state.notifications.timezone);
        let html = '<div class="year-grid">';

        for (let m0 = 0; m0 < 12; m0++) {
          const days = getDaysInMonth(y, m0);
          const first = getDowMon0(y, m0, 1);
          const st = getMonthStats(y, m0);
          const isCur = y === initNow.getFullYear() && m0 === initNow.getMonth();

          let dots = '';
          for (let i = 0; i < first; i++) dots += '<div></div>';
          for (let d = 1; d <= days; d++) {
            const iso = formatDateISO(y, m0, d);
            const info = getDayInfo(iso);
            const commonOff = isCommonDayOff(iso);
            dots += `<div class="mini-dot type-${info.type} ${info.type === 'off' && commonOff ? 'common-off' : ''} ${iso === todayStr ? 'is-today' : ''}"></div>`;
          }

          html += `
            <button type="button" class="year-month-card ${isCur ? 'current' : ''}" data-action="open-month" data-month="${m0}">
              <div class="row-between">
                <strong style="font-size:13px;">${MONTHS_RU[m0]}</strong>
                <span class="xs muted" style="font-weight:700;">${st.shifts} см</span>
              </div>
              <div class="mini-days-grid">${dots}</div>
            </button>
          `;
        }
        return html + '</div>';
      }

      // === 16. УНИВЕРСАЛЬНОЕ ЗАКРЫТИЕ И РЕНДЕР ВСЕХ МОДАЛОК / BOTTOM SHEETS ===
      function hasAnyModalOpen() {
        return Boolean(
          ui.editingDate ||
          ui.showCustomCycleModal ||
          ui.showPartnerSheet ||
          ui.pendingSyncParam ||
          ui.showImportModal ||
          ui.showResetModal
        );
      }

      function closeAllModals() {
        const wasOpen = hasAnyModalOpen();
        ui.editingDate = null;
        ui.showCustomCycleModal = false;
        ui.showPartnerSheet = false;
        ui.pendingSyncParam = null;
        ui.showImportModal = false;
        ui.showResetModal = false;
        PlatformBridge.backButton.hide();
        renderModals();
        if (wasOpen) PlatformBridge.haptic('light');
      }

      window.closeAllModals = closeAllModals;

      function renderCloseBtnHtml() {
        return `<button type="button" class="sheet-close" data-close-modal aria-label="Закрыть" onclick="window.closeAllModals()">${svgIcon('x', 20)}</button>`;
      }

      function renderModals() {
        const root = document.getElementById('modalRoot');
        if (!root) return;

        if (!hasAnyModalOpen()) {
          PlatformBridge.backButton.hide();
          root.innerHTML = '';
          return;
        }

        PlatformBridge.backButton.show(() => closeAllModals());

        if (ui.editingDate) root.innerHTML = renderDayEditorSheet(ui.editingDate);
        else if (ui.showCustomCycleModal) root.innerHTML = renderCustomCycleModal();
        else if (ui.showPartnerSheet) root.innerHTML = renderPartnerSheet();
        else if (ui.pendingSyncParam) root.innerHTML = renderIncomingSyncModal(ui.pendingSyncParam);
        else if (ui.showImportModal) root.innerHTML = renderImportModal();
        else if (ui.showResetModal) root.innerHTML = renderResetModal();

        bindModalInputs();
      }

      /**

              <div class="grid-2">
                <button type="button" class="btn btn-secondary btn-sm" data-close-modal onclick="window.closeAllModals()">Отмена</button>
                <button type="button" class="btn btn-danger-soft btn-sm" data-action="confirm-reset">Сбросить</button>
              </div>
            </div>
          </div>
        `;

      // === 17. ПРИВЯЗКА ИНПУТОВ ВКЛАДОК И МОДАЛОК ===

            saveState();
            renderAll();
          };
        }
        const otTh = document.getElementById('inpOtThreshold') || document.getElementById('inpSettingsOt');
        if (otTh) {
          otTh.onchange = (e) => {
            state.schedule.overtimeThreshold = Math.max(40, Number(e.target.value) || 160);

            renderAll();
          };
        }

        if (custTime) {
          custTime.onchange = (e) => {
            state.notifications.customTime = e.target.value || '19:00';

            renderAll();
          };

        if (tzSel) {

            renderAll();

        if (formCheck) {
          formCheck.onsubmit = (e) => {
            e.preventDefault();

            if (!txt) return;
            state.checklist.push({ id: 'c_' + Date.now(), text: txt, checked: false });
            saveState();
            PlatformBridge.haptic('light');
            renderAll();

        }
        const profInp = document.getElementById('inpProfileName');
        if (profInp) {
          profInp.onchange = (e) => {
            state.profile.name = (e.target.value || 'Гость').trim();

          };

        const sDate = document.getElementById('inpStartDate');
        if (sDate) {
          sDate.onchange = (e) => {
