      function syncCustomCycleDraftInputs() {
        const sd = document.getElementById('ccStartDate');
        const dh = document.getElementById('ccDefaultHours');
        const pm = document.getElementById('ccPayMode');
        const pr = document.getElementById('ccPayRate');
        if (sd && sd.value) ui.customCycleStartDate = sd.value;
        if (dh) ui.customCycleHours = Math.min(24, Math.max(1, Number(dh.value) || 12));
        if (pm) ui.customCyclePayMode = pm.value === 'hour' ? 'hour' : 'shift';
        if (pr) ui.customCycleRate = Math.max(0, Number(pr.value) || 0);
      }

      function bindModalInputs() {
        // Конструктор своего цикла — сохраняем значения полей при изменении
        const ccPm = document.getElementById('ccPayMode');
        if (ccPm) {
          ccPm.onchange = () => {
            syncCustomCycleDraftInputs();
            ui.customCycleRate = ui.customCyclePayMode === 'hour' ? state.schedule.hourlyRate : state.schedule.shiftRate;
            const prEl = document.getElementById('ccPayRate');
            if (prEl) prEl.value = ui.customCycleRate;
          };
        }
        ['ccStartDate', 'ccDefaultHours', 'ccPayRate'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.onchange = syncCustomCycleDraftInputs;
        });

        // Редактор дня
        const form = document.getElementById('dayEditForm');
        if (form) {
          const shType = document.getElementById('shType');
          const shStart = document.getElementById('shStart');
          const shEnd = document.getElementById('shEnd');
          const shHours = document.getElementById('shHours');
          const shBonus = document.getElementById('shBonus');

          const updatePreview = () => {
            const type = shType.value;
            const hours = Number(shHours.value) || 0;
            const bonus = Number(shBonus.value) || 0;
            const m = calculateDayPay({ date: form.dataset.date, type, hours, bonus });
            const el = document.getElementById('shPayPreview');
            if (el) el.textContent = `За день: ${formatMoney(m.pay)}`;
          };

          form.querySelectorAll('.sheet-type-btn').forEach(btn => {
            btn.onclick = () => {
              const t = btn.dataset.type;
              const meta = SHIFT_TYPES[t];
              shType.value = t;
              form.querySelectorAll('.sheet-type-btn').forEach(b => {
                const act = b.dataset.type === t;
                b.classList.toggle('active', act);
                const dot = b.querySelector('span:first-child');
                if (dot) dot.style.background = act ? '#FFFFFF' : SHIFT_TYPES[b.dataset.type].colorVar;
              });
              document.getElementById('shWorkBox').style.display = meta.work ? 'flex' : 'none';
              if (meta.work) {
                const stdH = getStandardHours(t);
                const stT = t === 'night' ? '20:00' : (state.schedule.defaultStartTime || meta.defaultStart);
                shStart.value = stT;
                shHours.value = stdH;
                shEnd.value = computeEndTime(stT, stdH);
              }
              PlatformBridge.haptic('selection');
              updatePreview();
            };
          });

          shStart.oninput = () => { shEnd.value = computeEndTime(shStart.value, shHours.value); };
          shHours.oninput = () => { shEnd.value = computeEndTime(shStart.value, shHours.value); updatePreview(); };
          shEnd.oninput = () => { shHours.value = computeHoursBetween(shStart.value, shEnd.value, Number(shHours.value) || 12); updatePreview(); };
          shBonus.oninput = updatePreview;

          form.onsubmit = (e) => {
            e.preventDefault();
            const dStr = form.dataset.date;
            const type = shType.value;
            const isWork = SHIFT_TYPES[type].work;
            const hours = isWork ? Math.min(24, Math.max(0, Number(shHours.value) || 0)) : 0;
            const startTime = shStart.value || '08:00';
            const endTime = isWork ? (shEnd.value || computeEndTime(startTime, hours)) : '00:00';
            state.overrides[dStr] = {
              type,
              hours,
              startTime,
              endTime,
              bonus: Number(shBonus.value) || 0,
              note: (document.getElementById('shNote').value || '').trim()
            };
            saveState();
            PlatformBridge.haptic('success');
            closeAllModals();
            renderAll();
            showToast(`Смена на ${formatShortDate(dStr)} сохранена`, 'success');
          };
        }

        const fileInp = document.getElementById('fileImportJson');
        if (fileInp) {
          fileInp.onchange = (e) => {
            const f = e.target.files && e.target.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = () => { document.getElementById('txtImportJson').value = r.result || ''; };
            r.readAsText(f);
          };
        }
      }

      // === 18. ПОДКЛЮЧЕНИЕ ПАРТНЁРА И ЭКСПОРТ .ICS ===
      async function connectPartnerCode(rawCode) {
        const clean = String(rawCode || '').trim().replace(/^sync_/, '');
        if (!clean) {
          showToast('Введите код партнёра', 'warning');
          return;
        }

        const off = decodeOfflineCode(clean);
        if (off) {
          state.partner = {
            enabled: true,
            name: off.name,
            code: clean,
            preset: off.preset,
            cycle: off.cycle,
            startDate: off.startDate,
            overrides: {}
          };
          saveState();
          PlatformBridge.haptic('success');
          closeAllModals();
          renderAll();
          showToast(`График «${off.name}» подключён!`, 'success');
          return;
        }

        const cloudCode = clean.toUpperCase();
        showToast(`Ищем ${cloudCode} в Supabase...`, 'info');
        const res = await CloudSync.fetchPartnerBySyncCode(cloudCode);
        if (res.ok && res.data && res.data.schedule_config) {
          const sc = res.data.schedule_config;
          state.partner = {
            enabled: true,
            name: res.data.display_name || 'Партнёр',
            code: cloudCode,
            preset: sc.preset || '1/3',
            cycle: Array.isArray(sc.cycle) ? sc.cycle : (PRESETS[sc.preset]?.cycle || ['full24', 'off', 'off', 'off']),
            startDate: sc.startDate || getTodayISO(),
            overrides: res.data.overrides || {}
          };
          saveState();
          PlatformBridge.haptic('success');
          closeAllModals();
          renderAll();
          showToast(`Подключён график: ${state.partner.name}!`, 'success');
        } else {
          PlatformBridge.haptic('error');
          showToast(res.message || 'Код не найден', 'error');
        }
      }

      function exportYearICS() {
        try {
          const y = ui.viewYear;
          const tz = state.notifications.timezone || APP_CONFIG.DEFAULT_TIMEZONE;
          const checklistText = state.checklist.map(c => `- ${c.text}`).join('\\n');
          const out = [
            'BEGIN:VCALENDAR',
            'VERSION:2.0',
            'PRODID:-//SmenaPro//MultiPlatform//RU',
            'CALSCALE:GREGORIAN',
            'METHOD:PUBLISH',
            `X-WR-CALNAME:СменаPro ${y}`
          ];

          const fmtUtcICS = (ms) => {
            const dt = new Date(ms);
            return `${dt.getUTCFullYear()}${pad2(dt.getUTCMonth() + 1)}${pad2(dt.getUTCDate())}T${pad2(dt.getUTCHours())}${pad2(dt.getUTCMinutes())}00Z`;
          };

          for (let m0 = 0; m0 < 12; m0++) {
            const days = getDaysInMonth(y, m0);
            for (let d = 1; d <= days; d++) {
              const iso = formatDateISO(y, m0, d);
              const info = getDayInfo(iso);
              const meta = SHIFT_TYPES[info.type];
              if (!meta || !meta.work || info.hours <= 0) continue;

              const stMs = shiftToUtcMs(iso, info.startTime, tz);
              const enMs = stMs + info.hours * 3600000;
              const desc = [`Смена: ${meta.name} (${info.hours}ч)`];
              if (info.note) desc.push(`Заметка: ${info.note.replace(/\n/g, ' ')}`);
              if (checklistText) desc.push(`Чек-лист:\\n${checklistText}`);

              out.push(
                'BEGIN:VEVENT',
                `UID:smenapro-${iso}@smenapro`,
                `DTSTAMP:${fmtUtcICS(Date.now())}`,
                `DTSTART:${fmtUtcICS(stMs)}`,
                `DTEND:${fmtUtcICS(enMs)}`,
                `SUMMARY:Смена: ${meta.name} (${info.hours}ч)`,
                `DESCRIPTION:${desc.join('\\n')}`,
                'BEGIN:VALARM',
                'TRIGGER:-PT24H',
                'ACTION:DISPLAY',
                'DESCRIPTION:Завтра на смену! Проверьте чек-лист сборов.',
                'END:VALARM',
                'END:VEVENT'
              );
            }
          }
          out.push('END:VCALENDAR');
          downloadBlob(new Blob([out.join('\r\n')], { type: 'text/calendar;charset=utf-8' }), `SmenaPro_${y}.ics`);
          PlatformBridge.haptic('success');
          showToast(`Файл SmenaPro_${y}.ics выгружен!`, 'success');
        } catch (_) {
          showToast('Ошибка при экспорте .ics', 'error');
        }
      }

      function openCustomCycleBuilder() {
        ui.customCycleDraft = (Array.isArray(state.schedule.cycle) && state.schedule.cycle.length)
          ? state.schedule.cycle.slice()
          : ['day', 'night', 'recovery', 'off'];
        ui.customCycleStartDate = state.schedule.startDate;
        ui.customCycleHours = state.schedule.defaultHours;
        ui.customCyclePayMode = state.schedule.payMode;
        ui.customCycleRate = state.schedule.payMode === 'hour' ? state.schedule.hourlyRate : state.schedule.shiftRate;
        ui.showCustomCycleModal = true;
        renderModals();
      }

      // === 19. ГЛАВНЫЙ РЕНДЕР И ГЛОБАЛЬНОЕ ДЕЛЕГИРОВАНИЕ СОБЫТИЙ ===
      function renderAll() {
        applyTheme();
        renderShellChrome();

        const main = document.getElementById('mainContent');
        if (ui.activeTab === 'calendar') main.innerHTML = renderCalendarTab();
        else if (ui.activeTab === 'stats') main.innerHTML = renderStatsTab();
        else if (ui.activeTab === 'reminders') main.innerHTML = renderRemindersTab();
        else main.innerHTML = renderSettingsTab();

        bindTabInputs();
        renderModals();
      }

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && hasAnyModalOpen()) {
          e.preventDefault();
          closeAllModals();
        }
      });

      document.addEventListener('click', async (e) => {
        // 1. Закрытие по кнопке [data-close-modal] (крестик × или «Отмена»)
        if (e.target.closest('[data-close-modal]')) {
          e.preventDefault();
          closeAllModals();
          return;
        }

        // 2. Закрытие по прямому клику на подложку .modal-overlay
        if (e.target.classList && e.target.classList.contains('modal-overlay')) {
          e.preventDefault();
          closeAllModals();
          return;
        }

        // 3. Нижняя навигация
        const tabBtn = e.target.closest('.tab-btn');
        if (tabBtn) {
          ui.activeTab = tabBtn.dataset.tab;
          PlatformBridge.haptic('selection');
          renderAll();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }

        // 4. Кнопки шапки
        if (e.target.closest('#btnToday')) {
          const tz = state.notifications.timezone || APP_CONFIG.DEFAULT_TIMEZONE;
          const todayStr = getTodayISO(tz);
          const [y, m] = todayStr.split('-').map(Number);
          ui.viewYear = y;
          ui.viewMonth = m - 1;
          ui.selectedChartMonth = m - 1;
          ui.selectedDate = todayStr;
          ui.calendarMode = 'month';
          ui.activeTab = 'calendar';
          PlatformBridge.haptic('light');
          renderAll();
          return;
        }

        if (e.target.closest('#btnQuickTheme')) {
          state.themeMode = isDarkThemeActive() ? 'light' : 'dark';
          saveState();
          PlatformBridge.haptic('light');
          renderAll();
          return;
        }

        // 5. Действия по data-action
        const el = e.target.closest('[data-action]');
        if (!el) return;
        const act = el.dataset.action;

        switch (act) {
          case 'go-checklist':
            ui.activeTab = 'reminders';
            PlatformBridge.haptic('medium');
            renderAll();
            setTimeout(() => {
              const card = document.getElementById('checklistCard');
              if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 60);
            break;

          case 'go-calendar':
            ui.activeTab = 'calendar';
            PlatformBridge.haptic('light');
            renderAll();
            break;

          case 'quick-add-shift': {
            const tz = state.notifications.timezone || APP_CONFIG.DEFAULT_TIMEZONE;
            ui.editingDate = ui.selectedDate || getTodayISO(tz);
            PlatformBridge.haptic('light');
            renderModals();
            break;
          }

          case 'cal-mode':
            ui.calendarMode = el.dataset.mode;
            PlatformBridge.haptic('selection');
            renderAll();
            break;

          case 'cal-prev':
            if (ui.calendarMode === 'year') ui.viewYear--;
            else { ui.viewMonth--; if (ui.viewMonth < 0) { ui.viewMonth = 11; ui.viewYear--; } }
            PlatformBridge.haptic('light');
            renderAll();
            break;

          case 'cal-next':
            if (ui.calendarMode === 'year') ui.viewYear++;
            else { ui.viewMonth++; if (ui.viewMonth > 11) { ui.viewMonth = 0; ui.viewYear++; } }
            PlatformBridge.haptic('light');
            renderAll();
            break;

          case 'open-month':
            ui.viewMonth = Number(el.dataset.month);
            ui.calendarMode = 'month';
            PlatformBridge.haptic('selection');
            renderAll();
            break;

          case 'edit-day':
            ui.selectedDate = el.dataset.date;
            ui.editingDate = el.dataset.date;
            PlatformBridge.haptic('light');
            renderModals();
            break;

          case 'bonus-add': {
            const inp = document.getElementById('shBonus');
            if (inp) {
              inp.value = (Number(inp.value) || 0) + Number(el.dataset.delta);
              inp.dispatchEvent(new Event('input'));
              PlatformBridge.haptic('light');
            }
            break;
          }

          case 'reset-day':
            delete state.overrides[el.dataset.date];
            saveState();
            PlatformBridge.haptic('warning');
            closeAllModals();
            renderAll();
            showToast('День возвращён к базовому графику', 'info');
            break;

          // Конструктор своего цикла
          case 'open-custom-cycle':
            PlatformBridge.haptic('light');
            openCustomCycleBuilder();
            break;

          case 'cycle-add':
            syncCustomCycleDraftInputs();
            ui.customCycleDraft.push(el.dataset.type);
            PlatformBridge.haptic('light');
            renderModals();
            break;

          case 'cycle-del':
            syncCustomCycleDraftInputs();
            if (ui.customCycleDraft.length > 1) {
              ui.customCycleDraft.splice(Number(el.dataset.idx), 1);
              PlatformBridge.haptic('light');
              renderModals();
            } else {
              showToast('В цикле должен быть минимум 1 день', 'warning');
            }
            break;

          case 'cycle-move': {
            syncCustomCycleDraftInputs();
            const idx = Number(el.dataset.idx);
            const dir = Number(el.dataset.dir);
            const next = idx + dir;
            if (next >= 0 && next < ui.customCycleDraft.length) {
              const tmp = ui.customCycleDraft[idx];
              ui.customCycleDraft[idx] = ui.customCycleDraft[next];
              ui.customCycleDraft[next] = tmp;
              PlatformBridge.haptic('selection');
              renderModals();
            }
            break;
          }

          case 'cycle-save':
            syncCustomCycleDraftInputs();
            state.schedule.preset = 'custom';
            state.schedule.cycle = ui.customCycleDraft.slice();
            if (ui.customCycleStartDate) state.schedule.startDate = ui.customCycleStartDate;
            state.schedule.defaultHours = ui.customCycleHours;
            state.schedule.payMode = ui.customCyclePayMode;
            if (ui.customCyclePayMode === 'hour') state.schedule.hourlyRate = ui.customCycleRate;
            else state.schedule.shiftRate = ui.customCycleRate;
            saveState();
            PlatformBridge.haptic('success');
            closeAllModals();
            renderAll();
            showToast(`Свой цикл (${state.schedule.cycle.length} дн.) применён!`, 'success');
            break;

          // Партнёр
          case 'toggle-partner':
            state.partner.enabled = !state.partner.enabled;
            saveState();
            PlatformBridge.haptic('light');
            renderAll();
            break;

          case 'open-partner':
            ui.showPartnerSheet = true;
            PlatformBridge.haptic('light');
            renderModals();
            break;

          case 'partner-tab':
            ui.partnerTab = el.dataset.tab;
            PlatformBridge.haptic('selection');
            renderModals();
            break;

          case 'connect-partner-code': {
            const inp = document.getElementById('inpPartnerCode');
            connectPartnerCode(inp ? inp.value : '');
            break;
          }

          case 'connect-settings-code': {
            const inp = document.getElementById('inpSettingsPartnerCode');
            connectPartnerCode(inp ? inp.value : '');
            break;
          }

          case 'accept-incoming-sync':
            connectPartnerCode(el.dataset.code);
            break;

          case 'save-partner-manual': {
            const nm = (document.getElementById('inpPartnerName').value || 'Партнёр').trim();
            const pr = document.getElementById('selPartnerPreset').value;
            const sd = document.getElementById('inpPartnerStart').value || getTodayISO();
            state.partner = {
              enabled: true,
              name: nm,
              code: '',
              preset: pr,
              cycle: PRESETS[pr] ? PRESETS[pr].cycle.slice() : ['day', 'off'],
              startDate: sd,
              overrides: {}
            };
            saveState();
            PlatformBridge.haptic('success');
            closeAllModals();
            renderAll();
            showToast(`График «${nm}» включён!`, 'success');
            break;
          }

          case 'copy-text': {
            const ok = copyTextSafely(el.dataset.text || '');
            PlatformBridge.haptic(ok ? 'success' : 'error');
            showToast(ok ? (el.dataset.msg || 'Скопировано!') : 'Не удалось скопировать', ok ? 'success' : 'error');
            break;
          }

          case 'share-native': {
            const links = buildDeepLinks(state.profile.syncCode);
            const url = PlatformBridge.platform === 'max' ? links.maxLink : links.tgLink;
            const msg = `Подключи мой график смен в СменаPro, чтобы видеть наши общие выходные! Код: ${state.profile.syncCode}`;
            PlatformBridge.haptic('medium');
            PlatformBridge.share(msg, url);
            break;
          }

          // Статистика
          case 'stats-scope':
            ui.statsScope = el.dataset.scope;
            PlatformBridge.haptic('selection');
            renderAll();
            break;

          case 'stats-prev':
            if (ui.statsScope === 'year') ui.viewYear--;
            else { ui.viewMonth--; if (ui.viewMonth < 0) { ui.viewMonth = 11; ui.viewYear--; } ui.selectedChartMonth = ui.viewMonth; }
            PlatformBridge.haptic('light');
            renderAll();
            break;

          case 'stats-next':
            if (ui.statsScope === 'year') ui.viewYear++;
            else { ui.viewMonth++; if (ui.viewMonth > 11) { ui.viewMonth = 0; ui.viewYear++; } ui.selectedChartMonth = ui.viewMonth; }
            PlatformBridge.haptic('light');
            renderAll();
            break;

          case 'chart-metric':
            ui.statsMetric = el.dataset.metric;
            PlatformBridge.haptic('selection');
            renderAll();
            break;

          case 'chart-month':
            ui.selectedChartMonth = Number(el.dataset.month);
            PlatformBridge.haptic('selection');
            renderAll();
            break;

          case 'pay-mode':
            state.schedule.payMode = el.dataset.mode;
            saveState();
            PlatformBridge.haptic('selection');
            renderAll();
            break;

          case 'set-night-bonus':
            state.schedule.nightBonus = Number(el.dataset.val);
            saveState();
            PlatformBridge.haptic('selection');
            renderAll();
            break;

          case 'set-ot-mult':
            state.schedule.overtimeMultiplier = Number(el.dataset.val);
            saveState();
            PlatformBridge.haptic('selection');
            renderAll();
            break;

          // Пуши и чек-лист
          case 'toggle-push':
            state.notifications.enabled = !state.notifications.enabled;
            saveState();
            PlatformBridge.haptic('light');
            renderAll();
            break;

          case 'push-mode':
            state.notifications.mode = el.dataset.mode;
            saveState();
            PlatformBridge.haptic('selection');
            renderAll();
            break;

          case 'toggle-check': {
            const it = state.checklist.find(c => c.id === el.dataset.id);
            if (it) {
              it.checked = !it.checked;
              saveState();
              PlatformBridge.haptic(it.checked ? 'success' : 'light');
              renderAll();
            }
            break;
          }

          case 'del-check':
            state.checklist = state.checklist.filter(c => c.id !== el.dataset.id);
            saveState();
            PlatformBridge.haptic('warning');
            renderAll();
            break;

          case 'reset-checks':
            state.checklist.forEach(c => { c.checked = false; });
            saveState();
            PlatformBridge.haptic('light');
            renderAll();
            showToast('Галочки чек-листа сброшены', 'info');
            break;

          case 'preview-skin':
            ui.previewSkin = el.dataset.skin;
            PlatformBridge.haptic('selection');
            renderAll();
            break;

          case 'send-test-push':
            PlatformBridge.haptic('medium');
            await CloudSync.sendTestPush();
            break;

          // Пресеты, тема, бэкап
          case 'set-preset': {
            const prId = el.dataset.preset;
            if (prId === 'custom') {
              PlatformBridge.haptic('selection');
              openCustomCycleBuilder();
              break;
            }
            const pr = PRESETS[prId];
            if (pr) {
              state.schedule.preset = pr.id;
              state.schedule.cycle = pr.cycle.slice();
              state.schedule.defaultHours = pr.defaultHours;
              state.schedule.defaultStartTime = pr.defaultStart;
              saveState();
              PlatformBridge.haptic('selection');
              renderAll();
              showToast(`График: ${pr.label}`, 'success');
            }
            break;
          }

          case 'set-theme':
            state.themeMode = el.dataset.mode;
            saveState();
            PlatformBridge.haptic('selection');
            renderAll();
            break;

          case 'export-ics':
            exportYearICS();
            break;

          case 'export-json':
            downloadBlob(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }), `SmenaPro_backup_${getTodayISO()}.json`);
            PlatformBridge.haptic('success');
            showToast('Бэкап JSON сохранён', 'success');
            break;

          case 'open-import':
            ui.showImportModal = true;
            renderModals();
            break;

          case 'apply-import': {
            const raw = (document.getElementById('txtImportJson').value || '').trim();
            if (!raw) { showToast('Вставьте JSON или выберите файл', 'warning'); return; }
            try {
              const p = JSON.parse(raw);
              if (!p || !p.schedule) throw new Error('invalid');
              const def = createDefaultState();
              state = {
                ...def, ...p,
                profile: { ...def.profile, ...(p.profile || {}) },
                schedule: { ...def.schedule, ...(p.schedule || {}) },
                partner: { ...def.partner, ...(p.partner || {}) },
                notifications: { ...def.notifications, ...(p.notifications || {}) },
                overrides: p.overrides || {},
                checklist: Array.isArray(p.checklist) ? p.checklist : def.checklist
              };
              saveState();
              PlatformBridge.haptic('success');
              closeAllModals();
              renderAll();
              showToast('Данные восстановлены из бэкапа!', 'success');
            } catch (_) {
              PlatformBridge.haptic('error');
              showToast('Некорректный формат JSON', 'error');
            }
            break;
          }

          case 'open-reset':
            ui.showResetModal = true;
            PlatformBridge.haptic('warning');
            renderModals();
            break;

          case 'confirm-reset':
            safeRemoveStorage(STORAGE_KEY);
            state = createDefaultState();
            saveState();
            PlatformBridge.haptic('success');
            closeAllModals();
            renderAll();
            showToast('Данные сброшены к графику 1/3', 'info');
            break;

          // Диагностика
          case 'diag-test-sb': {
            PlatformBridge.haptic('medium');
            const res = await CloudSync.testConnection();
            renderAll();
            showToast(res.message, res.ok ? 'success' : 'error');
            break;
          }

          case 'diag-sync-now': {
            PlatformBridge.haptic('medium');
            await CloudSync.pushState(true);
            renderAll();
            break;
          }
        }
      });

      // === 20. МГНОВЕННЫЙ СИНХРОННЫЙ ЗАПУСК (0ms FIRST PAINT) ===
      function handleIncomingStartParam() {
        const sp = PlatformBridge.getStartParam();
        if (sp && sp.startsWith('sync_') && !ui.pendingSyncParam) {
          const code = sp.slice(5);
          if (code && code !== state.profile.syncCode) {
            ui.pendingSyncParam = code;
            renderModals();
          }
        }
      }

      function boot() {
        try {
          // 1. 0ms распознавание среды и пользователя из URL/Hash
          PlatformBridge.initZeroMs();

          // 2. Безопасная загрузка локального состояния
          state = loadState();
          ui.previewSkin = PlatformBridge.platform === 'max' ? 'max' : 'tg';

          // 3. МГНОВЕННЫЙ синхронный рендер всего интерфейса (без ожидания onload и сети)
          renderAll();
          handleIncomingStartParam();

          // 4. Асинхронная умная подгрузка SDK Telegram / MAX (никогда не блокирует старт)
          loadPlatformSdks();

          // 5. Неблокирующая фоновая синхронизация с Supabase с таймаутом 8с
          setTimeout(() => {
            CloudSync.sync(false);
          }, 120);

          // 6. Живое обновление таймера до смены каждые 30 секунд
          setInterval(() => {
            try { renderShellChrome(); } catch (_) {}
          }, 30000);
        } catch (err) {
          console.error('Boot recovery:', err);
          // Аварийное восстановление, чтобы экран никогда не остался пустым
          try {
            safeRemoveStorage(STORAGE_KEY);
            state = createDefaultState();
            renderAll();
          } catch (_) {}
        }
      }

      // Скрипт стоит в самом низу <body> — DOM уже полностью готов, запускаем НЕМЕДЛЕННО!
      boot();
    })();
  </script>
</body>
